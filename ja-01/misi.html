---
location: "JA-01"
---

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../style.css" />
  {% include head.html %}
  <style>
    .back-btn { display: inline-block; margin-bottom: 20px; font-weight: bold; color: #e67e22; text-decoration: none; }
    
    /* STYLING BANNER APD STICKY (DI-FREEZE) */
    .safety-banner {
      position: sticky;
      top: 20px; /* Angka ini bisa kamu besarkan (misal 80px) jika tertutup oleh navbar atas */
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-left: 5px solid #ef4444;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.15);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .safety-label { font-weight: 900; color: #b91c1c; font-size: 0.95rem; }
    .safety-items { display: flex; gap: 8px; flex-wrap: wrap; }
    .apd-badge { 
      background: #fee2e2; color: #991b1b; padding: 6px 12px; 
      border-radius: 8px; font-size: 0.85rem; font-weight: bold; 
      display: flex; align-items: center; gap: 5px;
    }

    /* STYLING KARTU TUGAS & PERALATAN */
    .task-item { display: flex; align-items: flex-start; gap: 15px; text-align: left; cursor: default; }
    .task-item input[type="checkbox"] { width: 22px; height: 22px; margin-top: 4px; accent-color: #e67e22; cursor: pointer; }
    .task-content { flex: 1; }
    .task-content h3 { margin: 0 0 12px 0; font-size: 1.1rem; }
    
    /* Tampilan Badge Alat Modern */
    .tools-container { margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px dashed #cbd5e1; }
    .tool-badge { 
      display: inline-block; background: #f1f5f9; color: #334155; 
      padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; 
      font-weight: 600; margin: 0 6px 6px 0; border: 1px solid #e2e8f0;
    }
    
    .steps-container { font-size: 0.95rem; line-height: 1.6; color: #444; margin-bottom: 15px; }
    .steps-label { font-weight: 800; color: #1e293b; margin-bottom: 5px; display: block; font-size: 0.9rem;}
    .task-meta { display: inline-block; padding: 4px 10px; background: #f8fafc; color: #475569; border-radius: 6px; font-size: 0.8rem; font-weight: bold; border: 1px solid #cbd5e1;}
    .loading-text { text-align: center; padding: 40px; color: #666; font-weight: bold; }
  </style>
</head>
<body>
  {% include navbar.html %}

  <main>
    <div class="content-container">
      <a href="index.html" class="back-btn">&larr; Kembali ke Daftar Tim</a>
      
      <section class="team-section">
        <div class="team-header">
          <span class="team-badge" style="background: #e67e22; color: #fff;">CHECKLIST</span>
          <h2 id="team-title">Memuat data...</h2>
        </div>
        
        <div class="safety-banner">
          <div class="safety-label">⚠️ WAJIB APD:</div>
          <div class="safety-items">
            <span class="apd-badge">👷 Helm</span>
            <span class="apd-badge">🧤 Sarung Tangan</span>
            <span class="apd-badge">🥾 Sepatu Safety</span>
          </div>
        </div>

        <div id="loading" class="loading-text">Sedang menyinkronkan data dengan server... ⏳</div>
        
        <div id="task-container" class="grid-cards" style="display: flex; flex-direction: column;">
          </div>
      </section>
    </div>
  </main>

  <footer class="simple-footer">
    <p>&copy; 2026 Tim Teknis A/V. All rights reserved.</p>
  </footer>

  <script>
    // --- MASUKKAN URL APPS SCRIPT KAMU DI SINI ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYkzFEfLuWTbIRKZgQTciFrfhRV9tqkNWzeYnq79AV4mlpy6OXk8YdUSM25e7BFtp_5w/exec"; 

    const urlParams = new URLSearchParams(window.location.search);
    const currentTeamId = urlParams.get('id');

    if(currentTeamId) {
      document.getElementById('team-title').innerText = "Tugas: " + currentTeamId.replace(/-/g, ' ').toUpperCase();
    } else {
      document.getElementById('team-title').innerText = "Kode Tim Tidak Valid";
      document.getElementById('loading').style.display = 'none';
      document.querySelector('.safety-banner').style.display = 'none'; // Sembunyikan APD jika error
    }

    async function fetchTasks() {
      if (!currentTeamId) return;
      try {
        const response = await fetch(APPS_SCRIPT_URL, { method: "GET", redirect: "follow" });
        const allTasks = await response.json();
        const teamTasks = allTasks.filter(task => task.kode === currentTeamId);
        renderTasks(teamTasks);
      } catch (error) {
        console.error("Fetch Error:", error);
        document.getElementById('loading').innerText = "⚠️ Gagal terhubung ke database. Cek koneksimu.";
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById('task-container');
      document.getElementById('loading').style.display = 'none';
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = '<div class="mission-card"><p style="text-align:center; margin:0;">Tidak ada tugas untuk tim ini.</p></div>';
        return;
      }

      tasks.sort((a, b) => parseInt(a.urutan) - parseInt(b.urutan));

      tasks.forEach(task => {
        const isChecked = task.selesai ? 'checked' : '';
        const card = document.createElement('div');
        card.className = 'mission-card task-item'; 
        
        // --- LOGIKA PEMISAHAN PERALATAN & LANGKAH ---
        let toolsHtml = '';
        let stepsHtml = task.deskripsi.replace(/\n/g, '<br>'); // Default jika format berbeda

        if (task.deskripsi.includes('Peralatan:') && task.deskripsi.includes('Langkah:')) {
          const parts = task.deskripsi.split('Langkah:');
          let alatRaw = parts[0].replace('Peralatan:', '').trim();
          let langkahRaw = parts[1].trim();
          
          // Bersihkan titik di akhir daftar alat jika ada
          if (alatRaw.endsWith('.')) alatRaw = alatRaw.slice(0, -1);
          
          // Pecah alat berdasarkan koma dan buat jadi badge
          const alatArray = alatRaw.split(',').map(item => item.trim()).filter(item => item !== "");
          const badgesHtml = alatArray.map(item => `<span class="tool-badge">🛠️ ${item}</span>`).join('');
          
          toolsHtml = `<div class="tools-container">${badgesHtml}</div>`;
          stepsHtml = `<span class="steps-label">Langkah-Langkah:</span><div class="steps-container">${langkahRaw.replace(/\n/g, '<br>')}</div>`;
        } else {
          // Jika tidak ada kata "Peralatan:" dan "Langkah:" di Excel, tampilkan teks biasa
          stepsHtml = `<div class="steps-container">${stepsHtml}</div>`;
        }
        
        card.innerHTML = `
          <input type="checkbox" id="task-${task.row}" ${isChecked} onchange="updateTaskStatus(${task.row}, this.checked)">
          <div class="task-content">
            <h3>${task.urutan}. ${task.judul}</h3>
            ${toolsHtml}
            ${stepsHtml}
            <span class="task-meta">⏱️ Target: ${task.target_menit} Menit | Zona: ${task.zona}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function updateTaskStatus(rowNumber, isCompleted) {
      const checkbox = document.getElementById(`task-${rowNumber}`);
      checkbox.disabled = true;
      const payload = { row: rowNumber, selesai: isCompleted };

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          redirect: "follow"
        });
        checkbox.disabled = false;
      } catch (error) {
        console.error("Update Error:", error);
        alert("Gagal mengupdate status ke server.");
        checkbox.checked = !isCompleted; 
        checkbox.disabled = false;
      }
    }

    fetchTasks();
  </script>
</body>
</html>
