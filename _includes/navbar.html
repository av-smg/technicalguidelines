<header>
    <div class="nav-container">
        <div class="nav-group-left">
            <button class="hamburger" id="menu-open-btn">
                <span></span><span></span><span></span>
            </button>
            <a href="{{ '/' | relative_url }}" class="logo-link">
                <img src="{{ '/assets/image_94faf8.png' | relative_url }}" alt="Logo" class="main-logo">
                <span class="site-tagline">Technical Guidelines</span>
            </a>
            
            <nav class="nav-menu" id="side-menu-drawer">
                <button class="menu-close" id="menu-close-btn">&times;</button>
                <div class="menu-content-top">
                    <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
                    <a href="{{ '/ja-01/' | relative_url }}" class="nav-link">JA-01</a>
                    <a href="{{ '/jw-08/' | relative_url }}" class="nav-link">JW-08</a>
                    <a href="{{ '/apendiks/' | relative_url }}" class="nav-link">Apendiks</a>
                    <a href="{{ '/audio/audio-inventaris.html' | relative_url }}" class="nav-link">Inventaris</a>
                </div>
            </nav>
        </div>

        <div class="nav-group-right">
            <div class="search-desktop-container" id="search-wrapper-desktop">
                <input type="text" id="missionSearch" 
                       placeholder="Cari..." 
                       autocomplete="off" 
                       onkeyup="filterMissions()"
                       onkeypress="handleSearchEnter(event)">
                <button class="search-toggle-btn" id="search-trigger-global">🔍</button>
            </div>

            <button class="theme-toggle" id="theme-toggle">
                <span id="theme-icon-status" class="theme-icon-status">🌙</span>
            </button>

            {% if page.location %}
            <div class="location-badge">{{ page.location }}</div>
            {% endif %}
        </div>
    </div>

    <div class="search-dropdown-mobile" id="search-mobile-dropdown">
        <div class="search-inner">
            <span>🔍</span>
            <input type="text" id="missionSearchMobile" 
                   placeholder="Cari panduan..." 
                   onkeyup="filterMissionsMobile()"
                   onkeypress="handleSearchEnter(event)">
            <button class="search-close-btn" id="search-close-mobile">&times;</button>
        </div>
    </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchBtn = document.getElementById('search-trigger-global');
    const searchWrapper = document.getElementById('search-wrapper-desktop');
    const searchDropdown = document.getElementById('search-mobile-dropdown');
    const inputDesktop = document.getElementById('missionSearch');
    const inputMobile = document.getElementById('missionSearchMobile');
    const closeMobileSearch = document.getElementById('search-close-mobile');

    // LOGIC SEARCH TOGGLE
    if (searchBtn) {
        searchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.innerWidth > 600) {
                searchWrapper.classList.toggle('active');
                if (searchWrapper.classList.contains('active')) {
                    inputDesktop.focus();
                }
            } else {
                searchDropdown.classList.add('active');
                inputMobile.focus();
            }
        });
    }

    if (closeMobileSearch) {
        closeMobileSearch.addEventListener('click', () => {
            searchDropdown.classList.remove('active');
        });
    }

    // Klik di luar untuk menutup search desktop
    window.addEventListener('click', (e) => {
        if (searchWrapper && !searchWrapper.contains(e.target) && e.target !== searchBtn) {
            searchWrapper.classList.remove('active');
        }
    });

    // HAMBURGER MENU LOGIC
    const menuOpen = document.getElementById('menu-open-btn');
    const menuClose = document.getElementById('menu-close-btn');
    const sideMenu = document.getElementById('side-menu-drawer');

    if (menuOpen && sideMenu) {
        menuOpen.addEventListener('click', () => sideMenu.classList.add('active'));
    }
    if (menuClose && sideMenu) {
        menuClose.addEventListener('click', () => sideMenu.classList.remove('active'));
    }
});

// REDIRECT KE HALAMAN SEARCH.HTML
function handleSearchEnter(event) {
    if (event.key === "Enter") {
        const query = event.target.value.trim();
        if (query.length > 0) {
            window.location.href = "{{ '/search.html' | relative_url }}?q=" + encodeURIComponent(query);
        }
    }
}

// FILTER INSTAN (Untuk halaman yang sedang dibuka)
function filterMissions() {
    let input = document.getElementById('missionSearch').value.toLowerCase();
    document.querySelectorAll('.location-main-card-link, .card-link, .mission-card').forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
    });
}
</script>
