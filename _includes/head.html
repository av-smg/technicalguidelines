<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- ========================================== -->
<!-- PWA (PROGRESSIVE WEB APP) CONFIGURATION    -->
<!-- ========================================== -->
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="{{ '/assets/image_94faf8.png' | relative_url }}">

<title>AV Department Site</title>

<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/image_94faf8.png' | relative_url }}">

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        // 1. Cek simpanan di browser
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            if(themeIcon) themeIcon.textContent = '☀️';
        }

        // 2. Fungsi Klik
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                
                if(themeIcon) themeIcon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                
                console.log("Mode saat ini:", isDark ? "Dark" : "Light");
            });
        }
    });
</script>

<!-- ========================================== -->
<!-- MESIN SERVICE WORKER (PWA ENGINE)          -->
<!-- ========================================== -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register("{{ '/sw.js' | relative_url }}")
                .then(reg => console.log('⚙️ PWA Engine Aktif! Siap di-install.'))
                .catch(err => console.log('⚠️ PWA Engine Gagal:', err));
        });
    }
</script>
