---
layout: default
title: Inventory Control 🚀
---

<style>
    /* CSS Khusus Inventaris yang melengkapi style.css utama */
    :root {
        --primary-purple: #8B5CF6;
        --soft-purple: #EDE9FE;
        --card-radius: 24px;
    }

    .hero { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .hero h1 { font-size: 42px; font-weight: 800; line-height: 1.2; }
    .hero h1 span { transform: rotate(-2deg); background: #FFE066; padding: 0 10px; border-radius: 8px; display: inline-block; color: #1A1A1A; }
    .hero p { color: var(--text-gray); font-size: 16px; margin-top: 12px; line-height: 1.5; margin-bottom: 20px;}
    
    .filter-container { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 30px; }
    .custom-input {
        padding: 12px 16px; border-radius: 100px; border: 2px solid #E5E7EB;
        font-family: inherit; font-size: 14px; font-weight: 600; outline: none;
        transition: all 0.3s ease; background: var(--card-bg); color: var(--text-dark); cursor: pointer;
    }
    .custom-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 4px var(--soft-blue); }
    .search-bar { flex-grow: 1; min-width: 200px; cursor: text; }

    .content-container { max-width: 1200px; margin: 0 auto; padding: 15px; }
    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

    .mission-card {
        background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--card-radius);
        padding: 16px; transition: all 0.3s ease; height: 100%; position: relative;
        display: flex; flex-direction: column; cursor: pointer;
    }
    .mission-card:hover { border-color: var(--primary-blue); transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.04); }

    .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 15px; background: #F9FAFB; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .mission-card h3 { font-size: 18px; font-weight: 800; color: var(--text-dark); text-transform: uppercase; }
    .qty-badge { background: var(--text-dark); color: var(--card-bg); padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 800; }

    .tag-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 100px; letter-spacing: 0.5px; }
    .badge-green { background: #D1FAE5; color: #059669; }
    .badge-gray { background: #E5E7EB; color: #4B5563; }
    .badge-red { background: #FEE2E2; color: #DC2626; }

    /* MODAL */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85);
        display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
        background: var(--card-bg); border-radius: var(--card-radius); max-width: 600px; width: 100%;
        padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; color: var(--text-dark);
    }
    .modal-close { position: absolute; top: -45px; right: 0; background: none; border: none; font-size: 32px; color: white; cursor: pointer; }
    .modal-main-img { width: 100%; height: 320px; object-fit: contain; border-radius: 16px; background: #F4F5F7; }
    .modal-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .modal-thumb { width: 100%; height: 75px; object-fit: cover; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .modal-thumb:hover { border-color: var(--primary-blue); }
</style>

<section class="hero">
    <h1>Cek Logistik: <br><span>Ready for Action!</span> ⚡</h1>
    <p>Pantau ketersediaan barang tim secara real-time dari database pusat.</p>
    
    <div class="filter-container">
        <select id="filterTim" class="custom-input">
            <option value="">🎯 Semua Tim</option>
        </select>
        <select id="filterMilik" class="custom-input">
            <option value="">🏢 Semua Kepemilikan</option>
        </select>
        <input id="searchInput" type="text" placeholder="🔍 Cari nama barang..." class="custom-input search-bar">
    </div>
</section>

<div class="content-container">
    <p id="loading" style="text-align: center; font-weight: bold; color: var(--text-gray);">⏳ Sinkronisasi data ke database...</p>
    <div id="grid" class="grid-cards"></div>
</div>

<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <button id="closeModal" class="modal-close">✕</button>
        <div style="text-align: center; margin-bottom: 20px;">
            <h2 id="modalName" style="font-weight: 800; text-transform: uppercase;">Nama Barang</h2>
            <div id="modalTags" class="tag-group" style="justify-content: center; margin-top: 10px;"></div>
        </div>
        <img id="modalImage" class="modal-main-img" src="" alt="Preview">
        <div id="modalThumbs" class="modal-thumbs"></div>
        <p id="modalDesc" style="margin-top: 20px; font-size: 14px; color: var(--text-gray); text-align: center; font-style: italic; background: var(--bg-color); padding: 15px; border-radius: 16px;"></p>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwNGJQ3nYwvKRZOFJtKSw39Aq7H3gNa1WRcsPaUCNkm_syiq5p_8eGpbiLnzo3Aj9rj/exec?action=api";

    const grid = document.getElementById("grid");
    const filterTim = document.getElementById("filterTim");
    const filterMilik = document.getElementById("filterMilik");
    const searchInput = document.getElementById("searchInput");
    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modalImage");
    const modalThumbs = document.getElementById("modalThumbs");
    const modalName = document.getElementById("modalName");
    const modalTags = document.getElementById("modalTags");
    const modalDesc = document.getElementById("modalDesc"); 

    document.getElementById("closeModal").onclick = () => modal.classList.remove("active");
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove("active"); });

    let allItems = [];

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById("loading").style.display = "none";
        allItems = data.filter(i => i.nama_barang && i.nama_barang !== "Nama Barang");
        populateFilters();
        renderItems();
      })
      .catch(err => {
        document.getElementById("loading").textContent = "❌ Koneksi Database Terputus.";
      });

    function populateFilters() {
        const timSet = new Set();
        const milikSet = new Set();
        allItems.forEach(i => {
            if (i.tim) timSet.add(i.tim);
            if (i.barang_milik) milikSet.add(i.barang_milik);
        });
        timSet.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t; opt.textContent = t;
            filterTim.appendChild(opt);
        });
        milikSet.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m; opt.textContent = m;
            filterMilik.appendChild(opt);
        });
    }

    function getCleanImageUrl(rawString) {
        if (!rawString) return null;
        const match = String(rawString).match(/id=([a-zA-Z0-9_-]+)/i);
        return match ? "https://drive.google.com/thumbnail?id=" + match[1] + "&sz=w800" : (String(rawString).startsWith("http") ? rawString : null);
    }

    function createBadges(item) {
        const frag = document.createDocumentFragment();
        
        const timBadge = document.createElement("span");
        timBadge.className = "badge";
        timBadge.textContent = item.tim || "UMUM";
        const tLower = String(item.tim).toLowerCase();
        
        if (tLower.includes("audio")) { timBadge.style.backgroundColor = "var(--primary-orange)"; timBadge.style.color = "white"; }
        else if (tLower.includes("video")) { timBadge.style.backgroundColor = "var(--primary-blue)"; timBadge.style.color = "white"; }
        else { timBadge.style.backgroundColor = "#E5E7EB"; timBadge.style.color = "#1A1A1A"; }
        
        frag.appendChild(timBadge);

        if (item.barang_milik) {
            const b = document.createElement("span");
            b.className = "badge badge-green";
            b.textContent = item.barang_milik;
            frag.appendChild(b);
        }
        return frag;
    }

    function renderItems() {
        grid.innerHTML = "";
        const tVal = filterTim.value.toLowerCase();
        const mVal = filterMilik.value.toLowerCase();
        const sVal = searchInput.value.toLowerCase();

        allItems.filter(i => {
            return (!tVal || String(i.tim).toLowerCase() === tVal) &&
                   (!mVal || String(i.barang_milik).toLowerCase() === mVal) &&
                   (!sVal || String(i.nama_barang).toLowerCase().includes(sVal));
        }).forEach(item => {
            const photos = [getCleanImageUrl(item.foto_1), getCleanImageUrl(item.foto_2), getCleanImageUrl(item.foto_3), getCleanImageUrl(item.foto_4)].filter(Boolean);
            
            const card = document.createElement("div");
            card.className = "mission-card";
            card.onclick = () => {
                modalImage.src = photos[0] || "";
                modalThumbs.innerHTML = "";
                photos.forEach(p => {
                    const t = document.createElement("img");
                    t.src = p; t.className = "modal-thumb";
                    t.onclick = (e) => { e.stopPropagation(); modalImage.src = p; };
                    modalThumbs.appendChild(t);
                });
                modalName.textContent = item.nama_barang;
                modalTags.innerHTML = "";
                modalTags.appendChild(createBadges(item));
                modalDesc.textContent = item.keterangan || "Tidak ada keterangan tambahan.";
                modal.classList.add("active");
            };

            const safeID = "tags-" + Math.random().toString(36).substr(2, 9);
            card.innerHTML = `
                <img src="${photos[0] || 'https://via.placeholder.com/400x300?text=No+Image'}" class="card-img">
                <div class="card-header">
                    <h3>${item.nama_barang}</h3>
                    <span class="qty-badge">${item.jumlah || 0}</span>
                </div>
                <div class="tag-group" id="${safeID}"></div>
                <p style="font-size: 13px; color: var(--text-gray); line-height: 1.4; font-style: italic;">${item.keterangan || ''}</p>
            `;
            grid.appendChild(card);
            document.getElementById(safeID).appendChild(createBadges(item));
        });
    }

    filterTim.onchange = renderItems;
    filterMilik.onchange = renderItems;
    searchInput.oninput = renderItems;
</script>
