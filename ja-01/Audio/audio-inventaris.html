---
layout: default
title: "Inventaris Audio"
location: "Semarang"
---

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Control 🚀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --primary-orange: #FF7E27;
            --soft-orange: #FFF0E5;
            --primary-blue: #3A70E2;
            --soft-blue: #E8EFFF;
            --bg-color: #F4F5F7;
            --text-dark: #1A1A1A;
            --text-gray: #6B7280;
            --card-radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 50px; }

        /* NAV */
        header { padding: 15px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .nav-container {
            max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.9);
            border-radius: 100px; display: flex; align-items: center; padding: 8px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5);
        }
        .logo-combined { display: flex; text-decoration: none; border-radius: 10px; overflow: hidden; font-weight: 800; margin-right: 12px; }
        .logo-part { padding: 6px 12px; }
        .logo-audio { background: var(--primary-orange); color: white; }
        .logo-video { background: var(--primary-blue); color: white; }

        /* HERO */
        .hero { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .hero span { background: #FFE066; padding: 0 8px; border-radius: 6px; }
        
        .filter-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .custom-input {
            padding: 12px 16px; border-radius: 100px; border: 2px solid #E5E7EB;
            font-size: 14px; font-weight: 600; outline: none; background: white;
        }
        .search-bar { flex-grow: 1; min-width: 250px; }

        /* GRID & CARDS */
        .content-container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .mission-card {
            background: white; border: 2px solid #F0F0F0; border-radius: var(--card-radius);
            padding: 16px; display: flex; flex-direction: column; cursor: pointer;
            transition: 0.3s; height: 100%;
        }
        .mission-card:hover { transform: translateY(-5px); border-color: var(--primary-orange); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        .card-img { width: 100%; height: 180px; object-fit: cover; border-radius: 16px; margin-bottom: 12px; background: #eee; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-header h3 { font-size: 16px; font-weight: 800; text-transform: uppercase; }
        .qty-badge { background: #1A1A1A; color: white; padding: 4px 10px; border-radius: 100px; font-size: 12px; }

        .tag-group { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 100px; text-transform: uppercase; }
        .badge-green { background: #D1FAE5; color: #059669; }
        .badge-red { background: #FEE2E2; color: #DC2626; }
        .badge-gray { background: #E5E7EB; color: #4B5563; }

        .card-desc { font-size: 13px; color: var(--text-gray); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white; border-radius: var(--card-radius); max-width: 500px; width: 100%;
            padding: 20px; position: relative;
        }
        .modal-main-img { width: 100%; height: 250px; object-fit: contain; background: #f9f9f9; border-radius: 15px; }
        .modal-thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .modal-thumb { width: 100%; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; opacity: 0.6; }
        .modal-thumb:hover { opacity: 1; }
        .modal-close { position: absolute; top: -40px; right: 0; color: white; font-size: 30px; background: none; border: none; cursor: pointer; }

        #loading { text-align: center; padding: 40px; font-weight: 700; color: var(--text-gray); }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <div class="logo-combined">
            <div class="logo-part logo-audio">A</div>
            <div class="logo-part logo-video">V</div>
        </div>
        <div style="font-weight: 700;">Inventory Team</div>
    </div>
</header>

<main>
    <section class="hero">
        <h1>Cek Logistik: <br><span>Ready for Action!</span> ⚡</h1>
        <div class="filter-container">
            <select id="filterTim" class="custom-input"><option value="">🎯 Semua Tim</option></select>
            <select id="filterMilik" class="custom-input"><option value="">🏢 Kepemilikan</option></select>
            <input id="searchInput" type="text" placeholder="🔍 Cari nama barang..." class="custom-input search-bar">
        </div>
    </section>

    <div class="content-container">
        <div id="loading">⏳ Menghubungkan ke satelit...</div>
        <div id="grid" class="grid-cards"></div>
    </div>
</main>

<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <button id="closeModal" class="modal-close">✕</button>
        <h2 id="modalName" style="margin-bottom: 10px; text-transform: uppercase;"></h2>
        <img id="modalImage" class="modal-main-img" src="">
        <div id="modalThumbs" class="modal-thumbs"></div>
        <p id="modalDesc" style="margin-top: 15px; font-size: 14px; color: var(--text-gray); background: #f4f4f4; padding: 10px; border-radius: 10px;"></p>
    </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_o-g7N48O6w9rJuoHyo2Z177xyBHSpQKJpzcCyJhdnzOtOIdWzVUyHeBwL4f3VDA5/exec?action=api";

let allItems = [];
const grid = document.getElementById("grid");

// 1. Ambil Data
fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
        document.getElementById("loading").style.display = "none";
        // Filter data agar tidak mengambil baris kosong atau header
        allItems = data.filter(item => item.nama_barang && item.nama_barang !== "Nama Barang");
        populateFilters();
        renderItems();
    });

function populateFilters() {
    const tims = [...new Set(allItems.map(i => i.tim).filter(Boolean))];
    const miliks = [...new Set(allItems.map(i => i.barang_milik).filter(Boolean))];
    
    tims.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t; opt.textContent = t;
        document.getElementById("filterTim").appendChild(opt);
    });
    miliks.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = m;
        document.getElementById("filterMilik").appendChild(opt);
    });
}

function renderItems() {
    grid.innerHTML = "";
    const fTim = document.getElementById("filterTim").value.toLowerCase();
    const fMilik = document.getElementById("filterMilik").value.toLowerCase();
    const fSearch = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allItems.filter(i => {
        return (!fTim || i.tim.toLowerCase() === fTim) &&
               (!fMilik || i.barang_milik.toLowerCase() === fMilik) &&
               (!fSearch || i.nama_barang.toLowerCase().includes(fSearch));
    });

    filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "mission-card";
        
        // Pilih foto pertama yang ada
        const mainImg = item.foto_1 || "https://via.placeholder.com/400x300?text=No+Image";

        card.innerHTML = `
            <img src="${mainImg}" class="card-img">
            <div class="card-header">
                <h3>${item.nama_barang}</h3>
                <span class="qty-badge">${item.jumlah}</span>
            </div>
            <div class="tag-group">
                <span class="badge ${item.tim.toLowerCase().includes('audio') ? 'logo-audio' : 'logo-video'}" style="color:white">${item.tim}</span>
                <span class="badge badge-green">${item.barang_milik}</span>
                <span class="badge ${item.kondisi === 'Rusak' ? 'badge-red' : 'badge-gray'}">${item.kondisi}</span>
            </div>
            <p class="card-desc">${item.keterangan || 'Tidak ada deskripsi.'}</p>
        `;

        card.onclick = () => openModal(item);
        grid.appendChild(card);
    });
}

function openModal(item) {
    const modal = document.getElementById("modal");
    document.getElementById("modalName").textContent = item.nama_barang;
    document.getElementById("modalDesc").textContent = item.keterangan || "Tidak ada keterangan tambahan.";
    
    const photos = [item.foto_1, item.foto_2, item.foto_3, item.foto_4].filter(Boolean);
    const mImg = document.getElementById("modalImage");
    mImg.src = photos[0] || "https://via.placeholder.com/400x300?text=No+Image";
    
    const thumbs = document.getElementById("modalThumbs");
    thumbs.innerHTML = "";
    photos.forEach(p => {
        const t = document.createElement("img");
        t.src = p; t.className = "modal-thumb";
        t.onclick = () => mImg.src = p;
        thumbs.appendChild(t);
    });

    modal.classList.add("active");
}

document.getElementById("closeModal").onclick = () => document.getElementById("modal").classList.remove("active");
document.getElementById("filterTim").onchange = renderItems;
document.getElementById("filterMilik").onchange = renderItems;
document.getElementById("searchInput").oninput = renderItems;
</script>

</body>
</html>
