---
location: "MISSION CARD"
---

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        
        .header-mc { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 40px 20px 30px; text-align: center; color: white; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header-mc h1 { font-weight: 900; margin: 0; font-size: 26px; letter-spacing: -1px; text-transform: uppercase; color: var(--primary-orange); }
        .header-mc p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.8; }

        .container-mc { max-width: 800px; margin: -20px auto 40px auto; padding: 0 15px; position: relative; z-index: 10; }

        /* TOOLBAR FILTER & LOGIN */
        .toolbar-mc { background: white; padding: 15px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        
        .select-modern { flex: 1; min-width: 200px; appearance: none; -webkit-appearance: none; background-color: #f8fafc; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 14px center; background-size: 14px; padding: 12px 38px 12px 16px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 14px; font-weight: 700; color: #1e293b; cursor: pointer; outline: none; transition: 0.2s; font-family: inherit; }
        .select-modern:focus { border-color: var(--primary-orange); background-color: white; box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1); }

        .btn-auth { padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 800; cursor: pointer; border: none; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
        .btn-auth.locked { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-auth.locked:hover { background: #e2e8f0; color: #1e293b; }
        .btn-auth.unlocked { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.1); }
        .btn-auth.unlocked:hover { background: #d1fae5; }

        /* BANNER APD */
        .safety-banner { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-left: 5px solid #ef4444; padding: 15px 20px; border-radius: 15px; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.15); margin-bottom: 25px; display: none; align-items: center; gap: 15px; flex-wrap: wrap; border-right: 1px solid #fee2e2; border-top: 1px solid #fee2e2; border-bottom: 1px solid #fee2e2; }
        .safety-label { font-weight: 900; color: #b91c1c; font-size: 14px; text-transform: uppercase; }
        .apd-badge { background: #fee2e2; color: #991b1b; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; border: 1px solid #fecaca; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* KARTU TUGAS */
        .task-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.3s; position: relative; overflow: hidden; }
        .task-card:hover { border-color: #cbd5e1; box-shadow: 0 10px 25px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .task-completed { opacity: 0.7; background: #f8fafc; border-color: #e2e8f0; }
        .task-completed .task-title { text-decoration: line-through; color: #94a3b8; }
        
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 15px; }
        .task-title-group { display: flex; gap: 15px; flex: 1; align-items: flex-start; }
        
        /* CHECKBOX CUSTOM */
        .custom-checkbox { position: relative; width: 32px; height: 32px; flex-shrink: 0; cursor: pointer; }
        .custom-checkbox input { opacity: 0; width: 0; height: 0; position: absolute; }
        .checkmark { position: absolute; top: 0; left: 0; width: 32px; height: 32px; background-color: #f1f5f9; border: 2px solid #cbd5e1; border-radius: 10px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .custom-checkbox input:checked ~ .checkmark { background-color: #10b981; border-color: #10b981; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .custom-checkbox input:disabled ~ .checkmark { background-color: #e2e8f0; border-color: #cbd5e1; cursor: not-allowed; opacity: 0.6; }
        .checkmark:after { content: "✓"; color: white; font-weight: 900; font-size: 18px; display: none; }
        .custom-checkbox input:checked ~ .checkmark:after { display: block; }
        .custom-checkbox:hover input:not(:disabled) ~ .checkmark { border-color: #10b981; }

        .task-title { margin: 0; font-size: 18px; font-weight: 800; color: #1e293b; line-height: 1.4; }
        
        .zone-badge { background: #e0e7ff; color: #3730a3; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; border: 1px solid #c7d2fe; white-space: nowrap; text-transform: uppercase; }
        .asset-badge { background: #fff7ed; color: #c2410c; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; border: 1px solid #ffedd5; margin-left: 5px; }

        .task-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 12px; margin: 15px 0; border: 1px solid #e2e8f0; }

        .tools-box { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px dashed #cbd5e1; margin-bottom: 15px; }
        .tool-label { font-size: 11px; font-weight: 900; color: #64748b; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 0.5px; }
        .tool-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .tool-item { background: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #334155; border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 5px; }
        .tool-item.cable { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }

        .steps-box { font-size: 14px; line-height: 1.6; color: #475569; font-weight: 500; }
        
        /* OVERLAY LOADING */
        .sync-overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.8); z-index: 10; display: none; align-items: center; justify-content: center; border-radius: 20px; backdrop-filter: blur(3px); }
        .sync-overlay span { font-weight: 800; color: var(--primary-orange); font-size: 14px; background: white; padding: 10px 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    {% include navbar.html %}

    <div class="header-mc">
        <h1>Mission Card</h1>
        <p>Akses Terbuka. Gunakan PIN untuk merubah status.</p>
    </div>

    <main class="container-mc">
        
        <!-- TOOLBAR: FILTER TIM & LOGIN -->
        <div class="toolbar-mc">
            <select id="teamSelect" class="select-modern" onchange="renderTasks()">
                <option value="all">Semua Tim (Loading...)</option>
            </select>
            
            <button id="btnAuth" class="btn-auth locked" onclick="loginKapten()">
                🔒 Kunci: Mode Pengamat
            </button>
            <input type="hidden" id="secretPin">
        </div>

        <!-- BANNER APD -->
        <div id="safetyBanner" class="safety-banner">
            <div class="safety-label">⚠️ WAJIB PAKAI APD:</div>
            <div id="apdItems" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>

        <!-- DAFTAR TUGAS -->
        <div id="taskList" style="min-height: 200px;">
            <div style="text-align: center; padding: 50px; color: gray; font-weight: bold;">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Mengunduh Rencana Kerja...
            </div>
        </div>
            
    </main>

<script>
    // ========================================================
    // ⚠️ GANTI URL INI DENGAN LINK APPS SCRIPT KAMU YANG BARU
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyg6ntp8BPWPP8qm9IfpN62Rwd272tAEiTM0Qgl1GQQkUqJGcViG-FnewlFqFTjZ4w-Zg/exec"; 
    
    // 🛠️ 15 PIN KHUSUS KAPTEN TIM
    const VALID_PINS = [
      "z1y2x3", "y2x3w4", "x3w4v5", "w4v5u6", "v5u6t7",
      "u6t7s8", "t7s8r9", "s8r9q0", "r9q0p1", "q0p1o2",
      "p1o2n3", "o2n3m4", "n3m4l5", "m4l5k6", "l5k6j7"
    ];

    let allTasks = [];
    let isEditMode = false;

    window.onload = async () => {
        let savedPin = localStorage.getItem("AV_MISSION_PIN") || "";
        if (savedPin && VALID_PINS.includes(savedPin)) {
            isEditMode = true;
            document.getElementById("secretPin").value = savedPin;
            document.getElementById("btnAuth").innerHTML = "🔓 Aktif: Mode Kapten";
            document.getElementById("btnAuth").className = "btn-auth unlocked";
        }

        try {
            const res = await fetch(SCRIPT_URL + "?action=api");
            const data = await res.json();
            
            const select = document.getElementById("teamSelect");
            select.innerHTML = '<option value="all">-- Tampilkan Semua Tim --</option>';
            
            if(data.mission_cards) {
                allTasks = data.mission_cards;
                
                let teamsFromTasks = allTasks.map(t => t.tim).filter(Boolean);
                let teamsFromDropdown = (data.dropdowns && data.dropdowns.tim) ? data.dropdowns.tim : [];
                
                let uniqueTeams = [...new Set([...teamsFromTasks, ...teamsFromDropdown])].sort();

                uniqueTeams.forEach(t => {
                    select.innerHTML += `<option value="${t}">${t}</option>`;
                });
            }
            
            renderTasks();

        } catch (e) {
            document.getElementById("taskList").innerHTML = '<div class="login-card" style="color:red; font-weight:bold;">Gagal memuat data dari server.</div>';
        }
    };

    function loginKapten() {
        if (isEditMode) {
            isEditMode = false;
            localStorage.removeItem("AV_MISSION_PIN");
            document.getElementById("secretPin").value = "";
            document.getElementById("btnAuth").innerHTML = "🔒 Kunci: Mode Pengamat";
            document.getElementById("btnAuth").className = "btn-auth locked";
            renderTasks(); 
            return;
        }

        let pin = prompt("Masukkan 6 Digit PIN Kapten Tim:");
        if (!pin) return;
        pin = pin.trim().toLowerCase();

        if (VALID_PINS.includes(pin)) {
            isEditMode = true;
            localStorage.setItem("AV_MISSION_PIN", pin);
            document.getElementById("secretPin").value = pin;
            document.getElementById("btnAuth").innerHTML = "🔓 Aktif: Mode Kapten";
            document.getElementById("btnAuth").className = "btn-auth unlocked";
            renderTasks(); 
        } else {
            alert("PIN Salah! Akses khusus Kapten Tim Lapangan.");
        }
    }

    function renderTasks() {
        const timDipilih = document.getElementById("teamSelect").value;
        const container = document.getElementById("taskList");
        container.innerHTML = "";

        let filteredTasks = allTasks;
        if (timDipilih !== "all") {
            filteredTasks = allTasks.filter(t => t.tim === timDipilih);
        }

        if (filteredTasks.length === 0) {
            container.innerHTML = `<div style="background:white; padding:30px; text-align:center; border-radius:15px; color:#64748b; font-weight:bold; border:1px solid #e2e8f0;">Belum ada rencana kerja untuk tim ini.</div>`;
            document.getElementById("safetyBanner").style.display = "none";
            return;
        }

        let globalApdSet = new Set();
        globalApdSet.add('🥾 Sepatu Safety');
        globalApdSet.add('👷 Helm');

        filteredTasks.forEach(task => {
            const isDone = (task.status === "Selesai" || task.status === "TRUE" || task.status === true);
            const card = document.createElement("div");
            card.className = "task-card " + (isDone ? "task-completed" : "");
            card.id = `card-${task.row_index}`;

            let rawText = task.deskripsi || "Tidak ada detail tugas.";
            let imgSrc = "";
            let imgRegex = /\[img:\s*(.+?)\]/i;
            let matchImg = rawText.match(imgRegex);
            
            if (matchImg) {
                let extractedUrl = matchImg[1].match(/https?:\/\/[^\s\]\)]+/); 
                if (extractedUrl) {
                    imgSrc = extractedUrl[0];
                } else {
                    imgSrc = matchImg[1].replace(/[\[\]\(\)]/g, ''); 
                }
                rawText = rawText.replace(matchImg[0], ""); 
            }

            let toolsHtml = '';
            let stepsHtml = rawText;
            
            let splitRegex = /Peralatan:([\s\S]*?)(Langkah:|Instruksi:|$)/i;
            let matchSplit = rawText.match(splitRegex);
            
            if (matchSplit && matchSplit[1].trim() !== '') {
                let alatRaw = matchSplit[1].trim().replace(/\.$/, "");
                let alatArray = alatRaw.split(',').map(i => i.trim()).filter(i => i !== "");

                let cables = [];
                let others = [];
                
                alatArray.forEach(item => {
                    let lowerItem = item.toLowerCase();
                    if (lowerItem.includes('helm') || lowerItem.includes('sarung tangan') || lowerItem.includes('sepatu')) {
                        globalApdSet.add(item); 
                    } else if (lowerItem.includes('kabel')) {
                        cables.push(`<span class="tool-item cable">🔌 ${item}</span>`);
                    } else {
                        let icon = '🛠️';
                        if(lowerItem.includes('speaker')||lowerItem.includes('toa')||lowerItem.includes('array')) icon = '🔊';
                        else if(lowerItem.includes('mic')) icon = '🎤';
                        others.push(`<span class="tool-item">${icon} ${item}</span>`);
                    }
                });

                if (cables.length > 0 || others.length > 0) {
                    toolsHtml = `<div class="tools-box"><span class="tool-label">Persiapan Aset & Alat</span><div class="tool-list">`;
                    toolsHtml += cables.join('') + others.join('');
                    toolsHtml += `</div></div>`;
                }

                let keyword = matchSplit[2];
                if (keyword) {
                    let textSteps = rawText.substring(rawText.indexOf(keyword)).replace(new RegExp(keyword, 'i'), '').trim();
                    stepsHtml = `<span class="tool-label" style="margin-top:10px;">${keyword}</span><div class="steps-box">${textSteps.replace(/\n/g, '<br>')}</div>`;
                } else { stepsHtml = ""; }
            } else {
                stepsHtml = `<div class="steps-box">${rawText.replace(/\n/g, '<br>')}</div>`;
            }

            let imgHtml = imgSrc ? `<img src="${imgSrc}" class="task-img">` : '';
            let asetHtml = task.kode_alokasi ? `<span class="asset-badge">Aset: ${task.kode_alokasi}</span>` : '';

            let checkDisabled = isEditMode ? "" : "disabled title='Gunakan PIN Kapten untuk merubah status'";

            card.innerHTML = `
                <div class="sync-overlay" id="sync-${task.row_index}">
                    <span><i class="fa-solid fa-circle-notch fa-spin"></i> Menyinkronkan ke Gudang...</span>
                </div>
                <div class="task-header">
                    <div class="task-title-group">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="check-${task.row_index}" ${isDone ? 'checked' : ''} ${checkDisabled} onchange="toggleTask(${task.row_index})">
                            <span class="checkmark"></span>
                        </label>
                        <div>
                            <h3 class="task-title">${task.nama_barang || "Tugas Teknis"}</h3>
                            <div style="margin-top:5px; font-size:12px; color:#64748b; font-weight:700;">Tim: ${task.tim || "-"}</div>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <span class="zone-badge">📍 ${task.zona || "TBA"}</span>
                        ${asetHtml}
                    </div>
                </div>
                ${toolsHtml}
                ${imgHtml}
                ${stepsHtml}
                
                ${task.teknisi ? `<div style="margin-top:15px; font-size:11px; color:#94a3b8; font-weight:bold;">Diselesaikan oleh: ${task.teknisi} (${task.waktu_selesai})</div>` : ''}
            `;
            container.appendChild(card);
        });

        if (globalApdSet.size > 0) {
            document.getElementById("safetyBanner").style.display = "flex";
            document.getElementById("apdItems").innerHTML = Array.from(globalApdSet).map(item => `<span class="apd-badge">${item}</span>`).join('');
        }
    }

    async function toggleTask(rowIndex) {
        if (!isEditMode) {
            alert("Akses Ditolak! Anda dalam Mode Pengamat.");
            document.getElementById(`check-${rowIndex}`).checked = !document.getElementById(`check-${rowIndex}`).checked;
            return;
        }

        const checkbox = document.getElementById(`check-${rowIndex}`);
        const card = document.getElementById(`card-${rowIndex}`);
        const syncLayer = document.getElementById(`sync-${rowIndex}`);
        
        const isSelesai = checkbox.checked;
        const pin = document.getElementById("secretPin").value;

        syncLayer.style.display = "flex";

        const payload = {
            action: "update_task",
            pin: pin,
            row_index: rowIndex,
            selesai: isSelesai
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if (data.status === "success") {
                if (isSelesai) card.classList.add("task-completed");
                else card.classList.remove("task-completed");
            } else {
                alert("Gagal: " + (data.message === "PIN_KAPTEN_SALAH" ? "PIN Kapten Tidak Valid / Ditolak!" : data.message));
                checkbox.checked = !isSelesai; 
            }
        } catch (e) {
            alert("Gagal terhubung ke server.");
            checkbox.checked = !isSelesai;
        } finally {
            syncLayer.style.display = "none";
        }
    }
</script>
</body>
</html>
