---
location: "MASTER"
---

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom-gudang.css">
    
    <style>
        /* MODAL ZOOM GAMBAR FULL SCREEN */
        .img-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 999999; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .img-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .img-modal-overlay img { max-width: 95%; max-height: 90%; border-radius: 8px; }
        .close-zoom-btn {
            position: absolute; top: 20px; right: 20px;
            background: white; color: black; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            font-size: 20px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    {% include navbar.html %}

    <main style="padding: 0 15px;">
        <div style="margin:15px 0;">
            <h2 style="font-weight:900; margin:0;">MISSION CARD</h2>
            <p style="font-size:11px; color:gray; margin:0;">Instruksi Pemasangan & Skema A/V</p>
        </div>

        <div class="toolbar-card" style="margin-bottom:15px;">
            <input type="text" id="searchMission" class="search-input-modern" placeholder="Cari Tim atau Tugas..." oninput="filterMissions()" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;">
        </div>

        <div id="loadingMission" style="text-align: center; padding: 40px; color: gray; font-weight:bold;">Memuat Instruksi...</div>
        
        <!-- CONTAINER KARTU MISI -->
        <div id="missionContainer" class="grid-cards"></div>
    </main>

    <!-- MODAL ZOOM GAMBAR -->
    <div id="imageZoomModal" class="img-modal-overlay" onclick="closeZoom()">
        <button class="close-zoom-btn" onclick="closeZoom()">✕</button>
        <img id="zoomedImage" src="" alt="Zoomed Skema">
    </div>

    <!-- MENGAMBIL MESIN LOGIKA MISSION CARD (Akan kita buat nanti) -->
    <script src="{{ site.baseurl }}/assets/js/script-mission.js"></script>
</body>
</html>
