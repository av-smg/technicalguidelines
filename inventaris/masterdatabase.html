---
location: "MASTER"
---

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        .page-title-section { text-align: center; margin: 20px 0 30px; }
        .page-title-section h2 { font-weight: 800; letter-spacing: -1px; text-transform: uppercase; color: var(--text-dark); margin-bottom: 5px;}
        
        /* TOOLBAR */
        .controls-wrapper { position: sticky; top: 75px; z-index: 900; margin: 0 -15px 15px -15px; padding: 10px 15px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .toolbar-card { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; background: var(--card-bg); padding: 12px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border-color); }
        .search-box-modern { display: flex; width: 100%; gap: 10px; }
        .search-input-wrapper { position: relative; flex: 1; }
        .search-input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-gray); font-size: 14px; pointer-events: none; }
        .search-input-modern { width: 100%; padding: 12px 15px 12px 40px; border-radius: 10px; border: 1px solid var(--border-color); outline: none; font-size: 14px; background: var(--bg-color); color: var(--text-dark); transition: all 0.3s ease; font-family: inherit; font-weight: 500; }
        .search-input-modern:focus { border-color: var(--primary-orange); box-shadow: 0 0 0 4px rgba(255,126,39,0.1); background: var(--card-bg); }
        
        .btn-scan { background: var(--text-dark); color: white; border: none; border-radius: 10px; padding: 0 15px; font-size: 16px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-scan:hover { background: var(--primary-orange); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,126,39,0.3); }

        .toolbar-bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .filter-group-modern { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
        
        .select-modern { appearance: none; -webkit-appearance: none; background-color: var(--bg-color); background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 12px; padding: 8px 30px 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 12px; font-weight: 700; color: var(--text-dark); cursor: pointer; outline: none; }
        
        .action-group-modern { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn-mod { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; outline: none; border: none; transition: 0.3s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-mod-primary { background: #2ecc71; color: white; box-shadow: 0 4px 10px rgba(46,204,113,0.2); }
        .btn-bulk { background: #3b82f6; color: white; }
        .btn-bulk.active { background: #ef4444; }

        /* GRID SYSTEM (Mobile 2 Kolom) */
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        
        @media (max-width: 768px) {
            .grid-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .toolbar-bottom { flex-direction: column; align-items: stretch; }
        }

        .mission-card { background: var(--card-bg); border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s; border: 2px solid var(--border-color); display: flex; flex-direction: column; position: relative; }
        .mission-card.selected { border-color: #3b82f6; background: #eff6ff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2); transform: scale(0.98); }
        .mission-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        
        .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: #eee; margin-bottom: 10px; }
        .mission-card h4 { font-weight: 800; font-size: 13px; margin: 0 0 5px 0; line-height: 1.3; color: var(--text-dark); }
        
        .badge-status { padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; border: 1px solid transparent; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: inline-block; }
        .status-gudang { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
        .status-keranjang { background: #fff7ed; color: #ea580c; border-color: #fdba74; }
        .status-perjalanan { background: #f3e8ff; color: #7e22ce; border-color: #d8b4fe; }
        .status-lokasi { background: #eff6ff; color: #2563eb; border-color: #93c5fd; }
        .status-dipakai { background: #f0fdf4; color: #16a34a; border-color: #86efac; }
        
        .badge-qty { background: var(--text-dark); color: var(--bg-color); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .card-codes { display:flex; gap: 5px; margin-bottom: 5px; flex-wrap: wrap; font-size: 10px; font-weight: 800; }
        .card-codes span { background: #f8fafc; padding: 2px 6px; border-radius: 4px; border: 1px solid #e2e8f0; }

        /* FLOATING BULK BAR */
        .bulk-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; box-shadow: 0 -5px 25px rgba(0,0,0,0.1); border-top: 1px solid #e2e8f0; display: none; justify-content: space-between; align-items: center; z-index: 9999; }
        .bulk-bar.active { display: flex; }
        .bulk-info { font-weight: 800; color: #1e293b; font-size: 14px; }
        .btn-bulk-process { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 99990; backdrop-filter: blur(5px); padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); border-radius: 20px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--card-bg); z-index: 10; }
        .close-x { font-size: 24px; cursor: pointer; border: none; background: none; color: var(--text-gray); }
        .modal-body { padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
        .modal-footer { padding: 15px 20px; display: flex; gap: 10px; border-top: 1px solid var(--border-color); }
        
        .input-text, .select-modern-form { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-color); font-size: 14px; outline: none; margin-bottom: 15px; font-weight: 500; font-family: inherit;}
        .label-tag { font-size: 11px; font-weight: 800; color: var(--text-gray); text-transform: uppercase; margin-bottom: 5px; display: block; }

        .btn-save { background: var(--primary-orange); color: white; flex:1; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor:pointer;}
        .btn-cancel { background: #e2e8f0; color: #475569; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor:pointer;}
        
        .photo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .photo-box { aspect-ratio: 1/1; border-radius: 12px; border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; background: var(--bg-color); cursor: pointer; overflow: hidden; position: relative; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        
        #qr-reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 15px; overflow: hidden; border: none !important; }
    </style>
</head>
<body>

    {% include navbar.html %}

    <main style="padding: 0 15px;">
        <div class="page-title-section">
            <h2>Inventory Portal</h2>
        </div>

        <div class="controls-wrapper">
            <div class="toolbar-card">
                <div class="search-box-modern">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" class="search-input-modern" placeholder="Cari nama, Kode, Wadah..." oninput="applyFilters()">
                    </div>
                    <button onclick="openScannerModal()" class="btn-scan"><i class="fa-solid fa-qrcode"></i></button>
                </div>

                <div class="toolbar-bottom">
                    <div class="filter-group-modern">
                        <select id="statusSelect" class="select-modern" onchange="applyFilters()">
                            <option value="all">Semua Status</option>
                            <option value="Di Gudang">Di Gudang</option>
                            <option value="Siap Dibawa">Keranjang (Siap Dibawa)</option>
                            <option value="Dalam Perjalanan">Dalam Perjalanan</option>
                            <option value="Di Gedung UTC">Di Gedung UTC</option>
                            <option value="Perjalanan ke Yogya">Perjalanan ke Yogya</option>
                            <option value="Gedung di Yogya">Gedung di Yogya</option>
                            <option value="Di Lokasi">Di Lokasi Lainnya</option>
                            <option value="Sedang Dipakai">Terpasang / Dipakai</option>
                        </select>
                        <select id="teamSelect" class="select-modern" onchange="applyFilters()"><option value="all">Semua Tim</option></select>
                    </div>

                    <div class="action-group-modern">
                        <button onclick="openAddModal()" class="btn-mod btn-mod-primary"><i class="fa-solid fa-plus"></i> Baru</button>
                        <button id="btnBulkMode" onclick="toggleBulkMode()" class="btn-mod btn-bulk"><i class="fa-solid fa-check-double"></i> Keranjang</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading" style="text-align: center; padding: 50px; font-weight: 700; color: gray;">Memuat data...</div>
        <div id="dataContainer" class="grid-cards"></div>
    </main>

    <!-- FLOATING BOTTOM BAR UNTUK BULK UPDATE -->
    <div id="bulkBar" class="bulk-bar">
        <span id="bulkCount" class="bulk-info">0 Terpilih</span>
        <button onclick="openBulkUpdateModal()" class="btn-bulk-process">Ubah Status Bersamaan</button>
    </div>

    <!-- MODAL BULK UPDATE -->
    <div id="modalBulk" class="modal-overlay">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 style="font-weight: 800; font-size: 16px; margin:0;">UBAH STATUS BERSAMAAN</h3>
                <button onclick="document.getElementById('modalBulk').classList.remove('active')" class="close-x">✕</button>
            </div>
            <div class="modal-body" style="display: block;">
                <span class="label-tag">Pilih Status Baru:</span>
                <select id="bulkNewStatus" class="select-modern-form">
                    <option value="Siap Dibawa">🛒 Tambah ke Keranjang (Siap Dibawa)</option>
                    <option value="Di Gudang">🏢 Kembalikan ke Gudang</option>
                    <option value="Dalam Perjalanan">🚚 Dalam Perjalanan</option>
                    <option value="Di Gedung UTC">📍 Di Gedung UTC</option>
                    <option value="Perjalanan ke Yogya">🚚 Perjalanan ke Yogya</option>
                    <option value="Gedung di Yogya">📍 Gedung di Yogya</option>
                    <option value="Di Lokasi">📍 Di Lokasi Lainnya</option>
                    <option value="Sedang Dipakai">🔌 Sedang Dipakai / Pasang</option>
                </select>
            </div>
            <div class="modal-footer">
                <button id="btnProsesBulk" class="btn-save" onclick="processBulkUpdate()" style="width: 100%;">PROSES UPDATE</button>
            </div>
        </div>
    </div>

    <!-- MODAL SCANNER QR -->
    <div id="modalScanner" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px; padding: 20px; text-align: center;">
            <div class="modal-header" style="padding: 0 0 15px 0;">
                <h3 style="font-weight: 800; font-size: 16px;">🔍 SCAN QR/BARCODE</h3>
                <button onclick="closeScannerModal()" class="close-x">✕</button>
            </div>
            <div id="qr-reader"></div>
        </div>
    </div>

    <!-- MODAL EDIT SATUAN -->
    <div id="modalEdit" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-weight: 800; font-size: 18px;">EDIT BARANG</h3>
                <button onclick="closeModalEdit()" class="close-x">✕</button>
            </div>
            <div class="modal-body">
                <div style="flex:1; min-width:300px;">
                    <span class="label-tag">Status Inventaris</span>
                    <select id="m-status-digunakan" class="select-modern-form" style="border: 2px solid var(--primary-orange);">
                        <option value="Di Gudang">Di Gudang</option>
                        <option value="Siap Dibawa">Siap Dibawa (Keranjang)</option>
                        <option value="Dalam Perjalanan">Dalam Perjalanan</option>
                        <option value="Di Gedung UTC">Di Gedung UTC</option>
                        <option value="Perjalanan ke Yogya">Perjalanan ke Yogya</option>
                        <option value="Gedung di Yogya">Gedung di Yogya</option>
                        <option value="Di Lokasi">Di Lokasi Lainnya</option>
                        <option value="Sedang Dipakai">Sedang Dipakai / Pasang</option>
                    </select>
                    
                    <span class="label-tag">Nama Barang</span>
                    <input type="text" id="m-nama" class="input-text">
                    
                    <span class="label-tag">Kode Wadah / Box</span>
                    <input type="text" id="m-wadah" class="input-text" style="color: #2563eb; font-weight: bold;">
                    
                    <span class="label-tag">Kode Barang (Satuan)</span>
                    <input type="text" id="m-kode" class="input-text" style="color: var(--primary-orange); font-weight: bold;">
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeModalEdit()" class="btn-cancel" style="flex:1;">BATAL</button>
                <button id="saveBtn" class="btn-save" style="flex:2;">SIMPAN</button>
            </div>
        </div>
    </div>

<script>
    const SCRIPT_URL = ""; // <-- PASTE URL WEBHOOK KAMU DI SINI
    
    // 📦 25 PIN KHUSUS ADMIN INVENTARIS
    const VALID_PINS = [
      "a1b2c3", "b2c3d4", "c3d4e5", "d4e5f6", "e5f6g7",
      "f6g7h8", "g7h8i9", "h8i9j0", "i9j0k1", "j0k1l2",
      "k1l2m3", "l2m3n4", "m3n4o5", "n4o5p6", "o5p6q7",
      "p6q7r8", "q7r8s9", "r8s9t0", "s9t0u1", "t0u1v2",
      "u1v2w3", "v2w3x4", "w3x4y5", "x4y5z6", "y5z6a7", "v9t6c2"
    ];

    let allItems = [];
    let optionsData = { tim: [] };
    let userPin = localStorage.getItem("AV_INVENTORY_PIN") || ""; 
    let html5QrcodeScanner = null;
    let currentItem = null;
    
    // VARIABEL BULK MODE
    let isBulkMode = false;
    let selectedRows = new Set();

    window.onload = () => {
        if (checkAndRequestPin()) loadData();
    };

    function checkAndRequestPin() {
        if (!userPin) {
            while (true) {
                let input = prompt("Masukkan PIN Keamanan Petugas Gudang:");
                if (input === null) return false;
                if (VALID_PINS.includes(input.trim().toLowerCase())) {
                    userPin = input.trim().toLowerCase();
                    localStorage.setItem("AV_INVENTORY_PIN", userPin); break;
                } else alert("PIN Salah!");
            }
        }
        return true;
    }

    async function loadData() {
        try {
            document.getElementById("loading").style.display = "block";
            const res = await fetch(SCRIPT_URL + "?action=api&nocache=" + new Date().getTime());
            const rawData = await res.json();
            
            allItems = rawData.inventory.filter(item => item.nama_barang && item.nama_barang.toLowerCase() !== 'nama barang');
            optionsData = rawData.dropdowns || { tim: [] };
            
            document.getElementById("loading").style.display = "none";
            
            const dbTeams = [...new Set(allItems.map(i => i.tim).filter(Boolean))];
            const finalTeams = [...new Set([...dbTeams, ...(optionsData.tim || [])])].sort();
            const teamSelect = document.getElementById("teamSelect");
            teamSelect.innerHTML = `<option value="all">Semua Tim</option>`;
            finalTeams.forEach(t => teamSelect.innerHTML += `<option value="${t}">${t}</option>`);

            applyFilters();
        } catch (e) {
            document.getElementById("loading").innerHTML = `<span style="color:red;">Gagal memuat data.</span>`;
        }
    }

    function toggleBulkMode() {
        isBulkMode = !isBulkMode;
        const btn = document.getElementById("btnBulkMode");
        const bar = document.getElementById("bulkBar");
        
        if (isBulkMode) {
            btn.classList.add("active");
            btn.innerHTML = `<i class="fa-solid fa-xmark"></i> Batal Keranjang`;
            bar.classList.add("active");
        } else {
            btn.classList.remove("active");
            btn.innerHTML = `<i class="fa-solid fa-check-double"></i> Keranjang`;
            bar.classList.remove("active");
            selectedRows.clear();
            updateBulkCount();
        }
        applyFilters(); 
    }

    function toggleSelection(rowIndex) {
        if (selectedRows.has(rowIndex)) selectedRows.delete(rowIndex);
        else selectedRows.add(rowIndex);
        
        updateBulkCount();
        applyFilters(); 
    }

    function updateBulkCount() {
        document.getElementById("bulkCount").innerText = `${selectedRows.size} Barang Terpilih`;
    }

    function openBulkUpdateModal() {
        if (selectedRows.size === 0) { alert("Pilih minimal 1 barang dulu!"); return; }
        document.getElementById("modalBulk").classList.add("active");
    }

    async function processBulkUpdate() {
        const btn = document.getElementById("btnProsesBulk");
        const newStatus = document.getElementById("bulkNewStatus").value;
        
        btn.disabled = true; btn.innerText = "MEMPROSES...";

        const payload = {
            action: "bulk_update_status",
            pin: userPin,
            rows: Array.from(selectedRows),
            new_status: newStatus
        };

        try {
            const response = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            const data = await response.json();
            if(data.status === "success") {
                document.getElementById('modalBulk').classList.remove('active');
                toggleBulkMode(); 
                loadData(); 
            } else alert("Gagal: " + data.message);
        } catch (e) { alert("Error koneksi."); }
        finally { btn.disabled = false; btn.innerText = "PROSES UPDATE"; }
    }

    function applyFilters() {
        const q = document.getElementById("searchInput").value.toLowerCase();
        const teamVal = document.getElementById("teamSelect").value;
        const statusVal = document.getElementById("statusSelect").value;

        let filtered = allItems.filter(i => {
            const matchQ = i.nama_barang.toLowerCase().includes(q) || (i.kode_barang || "").toLowerCase().includes(q) || (i.kode_wadah || "").toLowerCase().includes(q);
            const matchTeam = (teamVal === 'all') || (i.tim === teamVal);
            const matchStatus = (statusVal === 'all') || (i.status_digunakan === statusVal);
            return matchQ && matchTeam && matchStatus;
        });

        render(filtered);
    }

    function getStatusClass(status) {
        if(!status) return 'badge-status status-gudang';
        if(status === 'Siap Dibawa') return 'badge-status status-keranjang';
        if(status === 'Di Gudang') return 'badge-status status-gudang';
        if(status === 'Sedang Dipakai') return 'badge-status status-dipakai';
        if(status.includes('Perjalanan')) return 'badge-status status-perjalanan';
        return 'badge-status status-lokasi'; 
    }

    function render(data) {
        const container = document.getElementById("dataContainer");
        container.innerHTML = "";
        
        data.forEach(item => {
            const card = document.createElement("div");
            const isSelected = selectedRows.has(item.row_index);
            
            card.className = "mission-card " + (isSelected ? "selected" : "");
            
            const imageSrc = item.fotos && item.fotos[0] ? item.fotos[0] : 'https://placehold.co/300x180/EEEEEE/999999?text=NO+IMAGE';
            const badgeClass = getStatusClass(item.status_digunakan);
            
            const wadahBadge = item.kode_wadah ? `<span>📦 ${item.kode_wadah}</span>` : "";
            const kodeBadge = item.kode_barang ? `<span style="color:var(--primary-orange);">#${item.kode_barang}</span>` : "";

            card.innerHTML = `
                ${isSelected ? '<div style="position:absolute; top:5px; right:5px; background:#3b82f6; color:white; border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:10px; z-index:5;">✓</div>' : ''}
                <img src="${imageSrc}" class="card-img" loading="lazy">
                <h4>${item.nama_barang}</h4>
                <div class="card-codes">${kodeBadge} ${wadahBadge}</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top: auto; padding-top:8px; border-top:1px solid #f1f5f9;">
                    <span class="${badgeClass}">${item.status_digunakan || "Di Gudang"}</span>
                    <span class="badge-qty">${item.jumlah || 0} Pcs</span>
                </div>
            `;

            card.onclick = () => {
                if (isBulkMode) toggleSelection(item.row_index);
                else openModalEdit(item);
            };
            container.appendChild(card);
        });
    }

    function openModalEdit(item) {
        currentItem = item;
        document.getElementById("m-nama").value = item.nama_barang || "";
        document.getElementById("m-kode").value = item.kode_barang || "";
        document.getElementById("m-wadah").value = item.kode_wadah || "";
        document.getElementById("m-status-digunakan").value = item.status_digunakan || "Di Gudang";
        document.getElementById("modalEdit").classList.add("active");
    }

    function closeModalEdit() {
        document.getElementById("modalEdit").classList.remove("active");
    }

    document.getElementById("saveBtn").onclick = async function() {
        const btn = this; btn.disabled = true; btn.innerHTML = `PROSES...`;
        const payload = {
            action: "update_item", pin: userPin, row_index: currentItem.row_index,
            nama: document.getElementById("m-nama").value.trim(),
            kode_barang: document.getElementById("m-kode").value.trim(),
            kode_wadah: document.getElementById("m-wadah").value.trim(),
            status_digunakan: document.getElementById("m-status-digunakan").value
        };
        try {
            const response = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
            const data = await response.json();
            if(data.status === "success") { closeModalEdit(); loadData(); }
            else alert("Gagal: " + data.message);
        } catch (e) { alert("Gagal terhubung."); } 
        finally { btn.disabled = false; btn.innerText = "SIMPAN"; }
    };

    function openScannerModal() {
        document.getElementById("modalScanner").classList.add("active");
        html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250, aspectRatio: 1.0 }, false);
        html5QrcodeScanner.render((decodedText) => {
            closeScannerModal();
            document.getElementById('searchInput').value = decodedText; 
            applyFilters(); 
            
            if (isBulkMode) {
                const foundItem = allItems.find(i => i.kode_barang === decodedText || i.kode_wadah === decodedText);
                if (foundItem && !selectedRows.has(foundItem.row_index)) {
                    toggleSelection(foundItem.row_index);
                }
            }
        });
    }

    function closeScannerModal() {
        if (html5QrcodeScanner) html5QrcodeScanner.clear();
        document.getElementById("modalScanner").classList.remove("active");
    }
</script>
</body>
</html>
