<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/image_94faf8.png">
<link rel="icon" type="image/png" href="../assets/image_94faf8.png">
<title>A/V Mission Control 🚀</title>
<script src="/assets/js/main.js"></script>
<script>
    // Tunggu sampai semua elemen HTML selesai dimuat
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        // 1. Cek simpanan di browser
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            if(themeIcon) themeIcon.textContent = '☀️';
        }

        // 2. Fungsi Klik
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                
                if(themeIcon) themeIcon.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                
                console.log("Mode saat ini:", isDark ? "Dark" : "Light"); // Cek di Console F12
            });
        }
    });
</script>
