location: "LOGIN"

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <title>Login Kru - A/V Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; margin: 0; padding: 0; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .login-card { background: #1e293b; padding: 40px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 320px; text-align: center; border: 1px solid #334155; }
        .login-title { font-size: 24px; font-weight: 900; margin: 0 0 5px 0; color: #f8fafc; }
        .login-title span { color: #f97316; }
        .login-subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 30px; }
        
        .pin-input { width: 100%; padding: 15px; font-size: 24px; font-weight: 900; text-align: center; letter-spacing: 5px; text-transform: uppercase; background: #0f172a; border: 2px solid #475569; color: #f97316; border-radius: 12px; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s; }
        .pin-input:focus { border-color: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.2); }
        
        .btn-login { width: 100%; padding: 15px; background: #f97316; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { background: #ea580c; transform: translateY(-2px); }
        .btn-login:active { transform: translateY(2px); }
        
        .btn-back { display: inline-block; margin-top: 20px; color: #94a3b8; font-size: 12px; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="font-size: 40px; margin-bottom: 10px;">🔐</div>
        <h1 class="login-title">A/V <span>LOGIN</span></h1>
        <p class="login-subtitle">Masukkan 5 Digit PIN Otorisasi</p>

        <input type="text" id="inputPin" class="pin-input" maxlength="5" placeholder="•••••" autocomplete="off" autocorrect="off" spellcheck="false">
        
        <button class="btn-login" onclick="prosesLogin()">AKSES MASUK</button>
        
        <a href="{{ site.baseurl }}/" class="btn-back">⬅ Kembali ke Beranda Publik</a>
    </div>

    <!-- KAMUS PIN & NAMA KRU -->

        };

        function prosesLogin() {
            const inputField = document.getElementById("inputPin");
            const pinDiformat = inputField.value.trim().toUpperCase();

            // Cek apakah PIN ada di dalam databaseKru
            if (databaseKru.hasOwnProperty(pinDiformat)) {
                const dataKru = databaseKru[pinDiformat];
                
                // Simpan NAMA dan ROLE ke memori HP
                localStorage.setItem('av_session_pin', pinDiformat);
                localStorage.setItem('av_session_nama', dataKru.nama);
                localStorage.setItem('av_session_role', dataKru.role);

                alert(`Berhasil masuk! Selamat bertugas, ${dataKru.nama} (${dataKru.role}).`);
                
                // Arahkan ke Beranda
                window.location.href = "{{ site.baseurl }}/";
            } else {
                alert("⛔ AKSES DITOLAK! PIN tidak terdaftar dalam sistem.");
                inputField.value = ""; // Kosongkan kolom jika salah
            }
        }

        // Fitur tekan 'Enter' di keyboard untuk Login
        document.getElementById("inputPin").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                prosesLogin();
            }
        });
    </script>
</body>
</html>
