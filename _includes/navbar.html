<header>
    <div class="nav-container" style="position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%;">
        
        <div class="nav-group-left" style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger" id="menu-open-btn">
                <span></span><span></span><span></span>
            </button>
            <a href="{{ '/' | relative_url }}" class="logo-link" style="display: flex; align-items: center; gap: 10px;">
                <img src="{{ '/assets/image_94faf8.png' | relative_url }}" alt="Logo" class="main-logo" style="height: 40px; width: auto;">
                <span class="site-tagline" style="font-weight: 700;">Technical Guidelines</span>
            </a>
            
            <nav class="nav-menu" id="side-menu-drawer">
                <button class="menu-close" id="menu-close-btn">&times;</button>
                <div class="menu-content-top">
                    <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
                    <a href="{{ '/ja-01/' | relative_url }}" class="nav-link">JA-01</a>
                    <a href="{{ '/jw-08/' | relative_url }}" class="nav-link">JW-08</a>
                    <a href="{{ '/apendiks/' | relative_url }}" class="nav-link">Apendiks</a>
                </div>
            </nav>
        </div>

        <div class="nav-group-right" style="display: flex; align-items: center; gap: 15px; position: relative;">
            
            <div class="search-wrapper" id="search-wrapper-desktop">
                <div class="search-content" style="display: flex; align-items: center;">
                    <input type="text" id="missionSearch" placeholder="Cari..." autocomplete="off" onkeyup="filterMissions()" onkeypress="handleSearchEnter(event)">
                    <button class="search-close" id="search-close-desktop" style="background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>
                </div>
            </div>

            <button class="mobile-search-trigger" id="search-trigger-global" 
                    style="display: flex !important; visibility: visible !important; opacity: 1 !important; background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 5px; z-index: 99;">
                🔍
            </button>

            <button class="theme-toggle" onclick="toggleTheme()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">
                <span class="theme-icon-status">🌙</span>
            </button>

            {% if page.location %}
            <div class="location-badge">{{ page.location }}</div>
            {% endif %}
        </div>
    </div>

    <div class="search-dropdown-mobile" id="search-mobile-dropdown">
        <div class="search-inner">
            <span>🔍</span>
            <input type="text" id="missionSearchMobile" placeholder="Cari..." onkeyup="filterMissionsMobile()" onkeypress="handleSearchEnter(event)">
            <button class="search-close-btn" id="search-close-mobile">&times;</button>
        </div>
    </div>
</header>

<style>
/* Animasi Box Search Desktop */
#search-wrapper-desktop {
    position: absolute;
    right: 110px; /* Di sebelah kiri tombol search & theme */
    top: 50%;
    transform: translateY(-50%) scaleX(0);
    transform-origin: right;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
}

#search-wrapper-desktop.active {
    transform: translateY(-50%) scaleX(1);
    opacity: 1;
    pointer-events: auto;
}

#search-wrapper-desktop input {
    border: 2px solid var(--primary-orange);
    padding: 8px 15px;
    border-radius: 50px;
    background: var(--card-bg);
    color: var(--text-dark);
    outline: none;
    width: 180px;
}

/* Search Mobile Dropdown */
#search-mobile-dropdown {
    position: fixed;
    top: -100px;
    left: 0;
    width: 100%;
    background: var(--nav-bg);
    padding: 15px;
    z-index: 1000;
    transition: 0.4s ease-in-out;
    opacity: 0;
    visibility: hidden;
}

#search-mobile-dropdown.active {
    top: 60px;
    opacity: 1;
    visibility: visible;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchBtn = document.getElementById('search-trigger-global');
    const searchWrapper = document.getElementById('search-wrapper-desktop');
    const searchDropdown = document.getElementById('search-mobile-dropdown');
    const inputDesktop = document.getElementById('missionSearch');
    const inputMobile = document.getElementById('missionSearchMobile');

    // Toggle Search
    if (searchBtn) {
        searchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.innerWidth > 600) {
                searchWrapper.classList.toggle('active');
                if (searchWrapper.classList.contains('active')) inputDesktop.focus();
            } else {
                searchDropdown.classList.toggle('active');
                if (searchDropdown.classList.contains('active')) inputMobile.focus();
            }
        });
    }

    // Close buttons
    document.getElementById('search-close-desktop')?.addEventListener('click', () => searchWrapper.classList.remove('active'));
    document.getElementById('search-close-mobile')?.addEventListener('click', () => searchDropdown.classList.remove('active'));

    // Theme Toggle
    window.toggleTheme = function() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.querySelectorAll('.theme-icon-status').forEach(icon => {
            icon.innerText = isDark ? '☀️' : '🌙';
        });
    };

    // Hamburger
    const menuDrawer = document.getElementById('side-menu-drawer');
    document.getElementById('menu-open-btn')?.addEventListener('click', () => menuDrawer.classList.add('active'));
    document.getElementById('menu-close-btn')?.addEventListener('click', () => menuDrawer.classList.remove('active'));
});

// Search Functions
function filterMissions() {
    let input = document.getElementById('missionSearch').value.toLowerCase();
    document.querySelectorAll('.location-main-card-link, .card-link').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}
function filterMissionsMobile() {
    let input = document.getElementById('missionSearchMobile').value.toLowerCase();
    document.querySelectorAll('.location-main-card-link, .card-link').forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
    });
}
function handleSearchEnter(event) {
    if (event.key === "Enter") {
        const firstMatch = document.querySelector('.location-main-card-link:not([style*="display: none"]), .card-link:not([style*="display: none"])');
        if (firstMatch) window.location.href = firstMatch.href;
    }
}
</script>
