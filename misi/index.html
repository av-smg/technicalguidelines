---
location: "MISSION CARD"
---
<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <title>Mission Control A/V</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom-misi.css?v=21.0">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .admin-only { display: none !important; }
        body.admin-mode-active .admin-only { display: inline-block !important; }
        .btn-lock { background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; padding: 4px 10px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size:10px;}
        body.admin-mode-active .btn-lock { background: #f0fdf4; border-color: #22c55e; color: #16a34a; }
        
        .aksi-misi, .aksi-gudang { display: none !important; }

        /* UI MODERN UNTUK HEADER MISI (RE-DESAIN V.21.0) */
        .misi-header-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin: 15px 10px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        body.dark-mode .misi-header-card { background: #1e293b; border-color: #334155; }
        
        .misi-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .misi-title-icon {
            background: #eff6ff;
            color: #3b82f6;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .modern-select { 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 12px 15px; 
            font-size: 14px; 
            font-weight: 800; 
            color: #4f46e5; 
            cursor: pointer; 
            outline: none; 
            transition: all 0.2s ease; 
        }
        .modern-select:focus, .modern-select:hover { border-color: #a5b4fc; background:#ffffff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }
        body.dark-mode .modern-select { background: #0f172a; color: #818cf8; border-color: #334155; }

        /* Desain Tombol Tim Baru (Pill) */
        .team-filters-modern {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .btn-team-modern {
            background: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-team-modern:hover { background: #e2e8f0; border-color: #94a3b8; }
        .btn-team-modern.active { background: #3b82f6; color: white; border-color: #2563eb; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        
        /* Grid Layout Khusus untuk Container Misi */
        .missions-container-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            padding: 0 10px 40px 10px;
        }
    </style>
</head>
<body id="missionBody">
    {% include navbar.html %}
    
    <main>
        <!-- PANEL KONTROL ATAS -->
        <div class="misi-header-card">
            <div class="misi-title-container">
                <div class="misi-title-icon">🎯</div>
                <div>
                    <h2 style="font-weight:900; margin:0; font-size:22px; color:#0f172a; letter-spacing:-0.5px;">MISSION CONTROL</h2>
                    <p style="font-size:11px; color:#64748b; margin:2px 0 0 0; font-weight:bold;">Status: <span id="modeStatusText" style="color:#10b981;">🟢 Read-Only Mode</span></p>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-size:12px; font-weight:bold; color:#64748b; display:block; margin-bottom:8px;">📍 Pilih Pangkalan Operasi (Kota Event):</label>
                <select id="dbKotaSelector" class="modern-select" style="width: 100%;" onchange="changeKota()">
                    <option value="Database_Misi_Semarang">🚩 Event Area Semarang</option>
                    <option value="Database_Misi_Yogya">🚩 Event Area Yogyakarta</option>
                </select>
            </div>

            <div>
                <label style="font-size:12px; font-weight:bold; color:#64748b; display:block; margin-bottom:8px;">👥 Pilih Divisi Tim:</label>
                <div class="team-filters-modern" id="teamFilters">
                    <button class="btn-team-modern" onclick="setTeamFilter('Inventaris')">🗂️ Inventaris</button>
                    <button class="btn-team-modern" onclick="setTeamFilter('Speaker')">🔊 Speaker</button>
                    <button class="btn-team-modern" onclick="setTeamFilter('Kabel')">🔌 Kabel</button>
                    <button class="btn-team-modern" onclick="setTeamFilter('Booth')">🎛️ Booth</button>
                </div>
            </div>
        </div>

        <div id="loading" style="text-align: center; padding: 40px; color: #64748b; font-weight:bold; font-size:13px;">📡 Mengambil data Misi dari Satelit...</div>
        
        <!-- Wadah Banner (Non-Grid) -->
        <div id="missionBanners" style="padding: 0 10px;"></div>
        <!-- Wadah Kartu (Grid) -->
        <div class="missions-container-grid" id="missionsContainer"></div>
    </main>

    <div id="toastMsg" class="toast-msg">Notifikasi</div>

    <script src="{{ site.baseurl }}/assets/js/script-misi.js?v=21.0"></script>

    <!-- SCRIPT KEAMANAN RBAC -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const userRole = localStorage.getItem('av_session_role');
        const userName = localStorage.getItem('av_session_nama');
        const statusText = document.getElementById('modeStatusText');

        if (!userRole) return; 

        if (userRole === "Master" || userRole === "Kapten") {
            const style = document.createElement('style');
            style.innerHTML = '.aksi-misi { display: inline-block !important; }';
            document.head.appendChild(style);

            if(statusText) {
                statusText.innerHTML = "🔴 Mission Mode Aktif";
                statusText.style.color = "#ef4444";
            }
        }
      });
    </script>
</body>
</html>
