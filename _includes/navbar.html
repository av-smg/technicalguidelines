<header>
    <div class="nav-container">
        <div class="nav-group-left">
            <button class="hamburger" id="menu-open-btn">
                <span></span><span></span><span></span>
            </button>
            <a href="../index.html" class="logo-link">
                <img src="/assets/image_94faf8.png" alt="Logo" class="main-logo">
                <span class="site-tagline">Technical Guidelines</span>
            </a>
            <nav class="nav-menu" id="side-menu-drawer">
                <button class="menu-close" id="menu-close-btn">&times;</button>
                <div class="menu-content-top">
                    <a href="../index.html" class="nav-link">Home</a>
                    <a href="ja-01/" class="nav-link">JA-01</a>
                    <a href="jw-08/" class="nav-link">JW-08</a>
                    <a href="apendiks/" class="nav-link">Apendiks</a>
                </div>
                <div class="menu-content-bottom-mobile">
                    <button class="theme-toggle-mobile" onclick="toggleTheme()">
                        <span class="theme-icon-status">🌙</span> <span>Mode Layar</span>
                    </button>
                </div>
            </nav>
        </div>

   <div class="nav-group-right">
    <div class="search-wrapper-desktop" id="search-desktop-container">
       <input type="text" id="missionSearch" placeholder="Cari..." onkeyup="filterMissions()" onkeypress="handleSearchEnter(event)">
        
<div id="search-results-list"></div>
        <button class="search-toggle-btn" id="search-trigger-global">🔍</button>
    </div>

    <button class="mobile-search-trigger" id="mobile-search-trigger-btn">🔍</button>

    <button class="theme-toggle" onclick="toggleTheme()">
        <span class="theme-icon-status">🌙</span>
    </button>

    {% if page.location %}<div class="location-badge">{{ page.location }}</div>{% endif %}
</div>

<div class="search-dropdown-mobile" id="search-mobile-dropdown">
    <div class="search-inner">
        <span>🔍</span>
        <input type="text" id="missionSearchMobile" placeholder="Cari..." onkeyup="filterMissionsMobile()" onkeypress="handleSearchEnter(event)">
        <div id="search-results-list"></div>
        <button class="search-close-btn" id="search-close-mobile">&times;</button>
    </div>
</div>
</header>

<script>
   document.addEventListener('DOMContentLoaded', function() {
    
    // === 1. PENGATURAN DARK MODE (SINKRON) ===
    const body = document.body;
    const themeIcons = document.querySelectorAll('.theme-icon-status');

    // Fungsi untuk memperbarui semua icon bulan/matahari
    function updateIcons(isDark) {
        themeIcons.forEach(icon => {
            icon.innerText = isDark ? '☀️' : '🌙';
        });
    }

    // Cek preferensi tersimpan di browser
    if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
        updateIcons(true);
    }

    // Fungsi global toggleTheme (bisa dipanggil dari atribut onclick di HTML)
    window.toggleTheme = function() {
        body.classList.toggle('dark-mode');
        const isDarkNow = body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
        updateIcons(isDarkNow);
    };

    // === 2. LOGIKA HAMBURGER MENU (MOBILE) ===
    const menuDrawer = document.getElementById('side-menu-drawer');
    const openBtn = document.getElementById('menu-open-btn');
    const closeBtn = document.getElementById('menu-close-btn');

    if (openBtn && menuDrawer) {
        openBtn.addEventListener('click', () => {
            menuDrawer.classList.add('active');
        });
    }

    if (closeBtn && menuDrawer) {
        closeBtn.addEventListener('click', () => {
            menuDrawer.classList.remove('active');
        });
    }

    // === 3. LOGIKA SEARCH (DESKTOP EXPAND & MOBILE DROPDOWN) ===
    const searchWrapper = document.getElementById('search-wrapper'); // Wrapper Desktop
    const searchDropdown = document.getElementById('search-dropdown-bar'); // Wrapper Mobile
    const searchBtn = document.getElementById('search-trigger-global');
    const searchInput = document.getElementById('missionSearch');

    if (searchBtn) {
        searchBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Mencegah window.onclick langsung menutup search
            
            // Deteksi apakah sedang di mobile atau desktop
            if (window.innerWidth > 600) {
                // Mode Desktop: Expand Horizontal
                if (searchWrapper) searchWrapper.classList.toggle('active');
            } else {
                // Mode Mobile: Dropdown Bawah
                if (searchDropdown) searchDropdown.classList.toggle('active');
            }
            
            // Fokus otomatis ke kotak ketik
            if (searchInput) searchInput.focus();
        });
    }

    // === 4. SISTEM TUTUP OTOMATIS (CLICK OUTSIDE) ===
    window.addEventListener('click', (event) => {
        // Tutup Search jika klik di luar area search
        if (searchWrapper && !searchWrapper.contains(event.target)) {
            searchWrapper.classList.remove('active');
        }
        if (searchDropdown && !searchDropdown.contains(event.target) && event.target !== searchBtn) {
            searchDropdown.classList.remove('active');
        }
        
        // Tutup Hamburger Menu jika klik di luar drawer
        if (menuDrawer && !menuDrawer.contains(event.target) && !openBtn.contains(event.target)) {
            menuDrawer.classList.remove('active');
        }
    });
});

// === 5. FUNGSI FILTER SEARCH (LIVE FILTER) ===
function filterMissions() {
    let input = document.getElementById('missionSearch').value.toLowerCase();
    // Mencari kartu di halaman utama atau halaman lokasi
    let cards = document.querySelectorAll('.location-main-card-link, .card-link');
    
    cards.forEach(card => {
        let title = card.querySelector('h2, h3');
        let desc = card.querySelector('p');
        let text = (title ? title.innerText : "") + (desc ? desc.innerText : "");
        
        // Sembunyikan kartu yang tidak cocok dengan kata kunci
        card.style.display = text.toLowerCase().includes(input) ? "" : "none";
    });
}
</script>
