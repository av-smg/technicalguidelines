<!-- KODE NAVBAR TERBARU -->
<style>
  /* Menambahkan style khusus untuk menu samping agar Dark Mode tidak tertutup */
  .side-menu {
    position: fixed; top: 0; left: -250px; width: 250px; height: 100vh;
    background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    transition: 0.3s; z-index: 9999; padding: 20px;
    display: flex; flex-direction: column; gap: 15px;
  }
  .side-menu.active { left: 0; }
  
  .side-menu a {
    text-decoration: none; color: #0f172a; font-weight: 800; font-size: 1.1rem;
    padding: 10px; border-radius: 10px; transition: 0.2s;
  }
  .side-menu a:hover, .side-menu a.active-link { background: #f1f5f9; color: #f97316; }
  
  .close-menu { align-self: flex-end; background: none; border: none; font-size: 1.5rem; font-weight: bold; cursor: pointer; color: #0f172a; margin-bottom: 10px; }
  
  /* Tombol Dark Mode di dalam Sidebar */
  .mobile-dark-btn {
    margin-top: auto; /* Mendorong tombol ke bagian paling bawah menu */
    background: #1e293b; color: white; border: none; padding: 12px;
    border-radius: 12px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: 0.2s;
  }
  .mobile-dark-btn:active { transform: scale(0.95); }

  /* Dark Mode Styles untuk Sidebar */
  body.dark-mode .side-menu { background: #0f172a; box-shadow: 2px 0 10px rgba(0,0,0,0.5); }
  body.dark-mode .side-menu a { color: #e2e8f0; }
  body.dark-mode .side-menu a:hover, body.dark-mode .side-menu a.active-link { background: #1e293b; color: #f97316; }
  body.dark-mode .close-menu { color: #f8fafc; }
  body.dark-mode .mobile-dark-btn { background: #f1f5f9; color: #0f172a; }
</style>

<!-- Tombol Hamburger (Bisa disesuaikan dengan posisi aslinya) -->
<button class="hamburger-btn" onclick="toggleMenu()" style="position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; z-index: 100;">
  ☰
</button>

<!-- Menu Samping (Sidebar) -->
<div class="side-menu" id="sideMenu">
  <button class="close-menu" onclick="toggleMenu()">×</button>
  
  <a href="{{ site.baseurl }}/" class="nav-item">🏠 Home</a>
  <a href="{{ site.baseurl }}/gudang/" class="nav-item">📦 Gudang (JA-01)</a>
  <a href="{{ site.baseurl }}/misi/" class="nav-item">🎯 Mission Control</a>
  <a href="{{ site.baseurl }}/apendiks/struktur-personil.html" class="nav-item">📋 Apendiks</a>
  
  <!-- Tombol Dark Mode yang aman dari bug visual -->
  <button class="mobile-dark-btn" onclick="toggleDarkMode()">
    <span id="darkIconMobile">🌙</span> <span id="darkTextMobile">Dark Mode</span>
  </button>
</div>

<script>
  // Fungsi Buka/Tutup Menu
  function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
  }

  // Fungsi Deteksi Halaman Aktif (Auto-Highlight)
  document.addEventListener("DOMContentLoaded", function() {
    const currentUrl = window.location.pathname;
    const navItems = document.querySelectorAll('.nav-item');
    
    navItems.forEach(link => {
      if(link.getAttribute('href') === currentUrl || currentUrl.includes(link.getAttribute('href') && link.getAttribute('href') !== '/')) {
        link.classList.add('active-link');
      }
    });
  });

  // Fungsi Dark Mode Toggle
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateDarkModeUI(isDark);
  }

  function updateDarkModeUI(isDark) {
    const icon = document.getElementById('darkIconMobile');
    const text = document.getElementById('darkTextMobile');
    if(icon && text) {
      icon.textContent = isDark ? '☀️' : '🌙';
      text.textContent = isDark ? 'Light Mode' : 'Dark Mode';
    }
  }

  // Cek preferensi saat load
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    updateDarkModeUI(true);
  }
</script>
