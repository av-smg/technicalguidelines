---
location: "MASTER"
---
<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom-gudang.css?v=28.0">
    
    <style>
        .form-input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 12px; }
        .form-label { font-size: 11px; font-weight: bold; color: gray; display: block; margin-bottom: 4px; }
        .detail-gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .detail-gallery::-webkit-scrollbar { height: 6px; }
        .detail-gallery::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .gallery-img { height: 160px; min-width: 160px; object-fit: cover; border-radius: 10px; scroll-snap-align: center; border: 1px solid #e2e8f0; cursor: zoom-in; }
        .gallery-box { position: relative; scroll-snap-align: center; }
        .badge-wadah { position: absolute; bottom: 8px; left: 8px; background: rgba(234, 88, 12, 0.9); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 900; }
        .edit-foto-box { border: 1px dashed #ccc; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 8px; background: #f8fafc; position: relative; }
        .edit-foto-preview { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; display: none; }
        .btn-remove-foto { position: absolute; top: 5px; right: 5px; background: #ef4444; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; display: none; font-weight: bold;}
        .zoom-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .zoom-overlay.active { opacity: 1; pointer-events: auto; }
        .zoom-overlay img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
        
        /* PERBAIKAN SPACING LIST VIEW MINIMALIS */
        .list-view-container { display: flex; flex-direction: column; gap: 6px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        .list-item { display: flex; align-items: flex-start; gap: 10px; background: white; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; position: relative; }
        .list-item.selected { border-color: #3b82f6; background: #eff6ff; border-width: 2px; padding: 7px 9px; }
        .list-img { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #f1f5f9; flex-shrink: 0; }
        .list-info { flex: 1; min-width: 0; }
        .list-title { font-weight: 800; font-size: 12px; margin: 0 0 2px 0; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .toast-msg { z-index: 9999999 !important; }
        
        /* FIX OVERLAP SAAT SCROLL (TEMBOK PENAHAN FULL WIDTH) */
        .toolbar-card {
            position: sticky;
            top: 0;
            z-index: 95;
            background: #ffffff; /* Warna solid penahan */
            margin: 0 -10px 10px -10px; /* Tarik mentok ke kiri & kanan layar */
            padding: 15px 10px 15px 10px; /* Kembalikan padding ke dalam */
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        body.dark-mode .toolbar-card { background: #0f172a; border-bottom: 1px solid #1e293b; }

        /* GEMBOK KEAMANAN: Tombol disembunyikan dari Publik secara baku */
        .aksi-misi, .aksi-gudang { 
            display: none !important; 
        }
    </style>
</head>
<body id="inventoryBody">
    {% include navbar.html %}
    <main style="padding: 0 10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0;">
            <div>
                <h2 style="font-weight:900; margin:0; font-size:18px;">LOGISTIK UTAMA</h2>
                <p style="font-size:10px; color:gray; margin:0;">Status: <span id="modeStatusText">🟢 Read-Only Mode</span></p>
            </div>
        </div>

        <div class="toolbar-card">
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <input type="text" id="searchInput" class="search-input-modern" placeholder="Cari alat, merk, atau kode..." oninput="applyFilters()" style="flex:1; padding:8px 10px; border-radius:6px; border:1px solid #ccc; font-size:12px;">
                <button onclick="openScannerModal()" style="padding:8px 12px; border-radius:6px; background:#1e293b; color:white; border:none; font-weight:bold; font-size:11px; display:flex; align-items:center; gap:4px;">📷 Scan QR</button>
            </div>
            
            <!-- DITAMBAHKAN TOMBOL EXPORT EXCEL -->
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;">
                <button onclick="openAddModal()" class="aksi-gudang" style="padding:6px 12px; border-radius:6px; background:#16a34a; color:white; border:none; font-weight:bold; font-size:11px;">➕ Tambah</button>
                <button id="btnBulkMode" onclick="toggleBulkMode()" class="aksi-gudang" style="padding:6px 12px; border-radius:6px; background:#ea580c; color:white; border:none; font-weight:bold; font-size:11px;">🛒 Massal</button>
                <button onclick="printSuratJalan()" class="aksi-gudang" style="padding:6px 12px; border-radius:6px; background:#3b82f6; color:white; border:none; font-weight:bold; font-size:11px;">📄 Cetak</button>
                <button onclick="exportToExcel()" class="aksi-gudang" style="padding:6px 12px; border-radius:6px; background:#10b981; color:white; border:none; font-weight:bold; font-size:11px;">📥 Export Excel</button>
                <button id="btnViewToggle" onclick="toggleViewMode()" style="padding:6px 12px; border-radius:6px; background:#f1f5f9; color:#334155; border:1px solid #ccc; font-weight:bold; font-size:11px; margin-left:auto;">📄 List View</button>
            </div>
            
            <div class="filter-pills-wrapper" style="margin-top:8px; margin-bottom:8px;">
                <button class="pill-btn active" data-filter="all" onclick="setFilterPill('all', this)">Semua Alat</button>
                <button class="pill-btn" data-filter="Akan Dibawa" onclick="setFilterPill('Akan Dibawa', this)">🛒 Akan Dibawa</button>
                <button class="pill-btn" data-filter="Sedang Dipakai" onclick="setFilterPill('Sedang Dipakai', this)">🔌 Dipakai</button>
                <button class="pill-btn" data-filter="Di Gudang" onclick="setFilterPill('Di Gudang', this)">🏢 Di Gudang</button>
                <button class="pill-btn" data-filter="Rusak" onclick="setFilterPill('Rusak', this)">🚨 Perbaikan</button>
            </div>

            <div style="margin-bottom: 2px;">
                <button id="btnBukaFilter" style="background:#334155; color:white; border:none; padding:6px 12px; border-radius:6px; font-size:10px; font-weight:bold; cursor:pointer;">
                    ⚙️ FILTER TIM
                </button>
            </div>

            <div id="panelFilterLanjutan" style="display:none; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px; margin-top: 6px;">
                <div style="display:flex; flex-wrap:wrap; gap:10px; font-size:11px; font-weight:bold;">
                    <label><input type="checkbox" class="cek-tim" value="Speaker"> Speaker</label>
                    <label><input type="checkbox" class="cek-tim" value="Kabel"> Kabel</label>
                    <label><input type="checkbox" class="cek-tim" value="Booth"> Booth</label>
                </div>
            </div>
        </div>

        <div id="loading" style="text-align: center; padding: 20px; color: gray; font-weight:bold; font-size:12px;">Memuat Data Database...</div>
        <div id="dataContainer" class="grid-cards"></div>
    </main>

    <!-- MODAL TAMBAH ALAT BARU -->
    <div id="modalAdd" class="modal-overlay">
        <div class="modal-content" style="max-width:400px; max-height:85vh; overflow-y:auto; background:white; padding:20px; border-radius:15px;">
            <h3 style="margin-top:0; color:#16a34a; margin-bottom:20px;">➕ Tambah Alat Baru</h3>
            <form id="formAdd" onsubmit="submitNewItem(event)">
                <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px dashed #cbd5e1; margin-bottom:15px; text-align:center;">
                    <label class="form-label" style="color:#1e293b; margin-bottom:10px; font-size:12px;">📸 Tambahkan Foto (Maksimal 3)</label>
                    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px;">
                        <button type="button" onclick="document.getElementById('addFotoKamera').click()" style="flex:1; padding:10px; border-radius:8px; background:#3b82f6; color:white; border:none; font-weight:bold; cursor:pointer; font-size:11px;">📷 Buka Kamera</button>
                        <button type="button" onclick="document.getElementById('addFotoGaleri').click()" style="flex:1; padding:10px; border-radius:8px; background:#8b5cf6; color:white; border:none; font-weight:bold; cursor:pointer; font-size:11px;">🖼️ Pilih Galeri</button>
                    </div>
                    <input type="file" id="addFotoKamera" accept="image/*" capture="environment" style="display:none;" onchange="handleNewFotos(this)">
                    <input type="file" id="addFotoGaleri" accept="image/*" multiple style="display:none;" onchange="handleNewFotos(this)">
                    <div id="previewAddFotos" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;"></div>
                </div>
                
                <label class="form-label">Nama Alat Utama *</label>
                <input type="text" id="addNama" class="form-input" required>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label class="form-label">Kode Barang</label>
                        <input type="text" id="addKode" class="form-input">
                    </div>
                    <div style="flex:1;">
                        <label class="form-label">Kode Wadah</label>
                        <input type="text" id="addWadah" class="form-input">
                    </div>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label class="form-label">Total (Qty)</label>
                        <input type="number" id="addJumlah" class="form-input" value="1" required>
                    </div>
                    <div style="flex:1;">
                        <label class="form-label">Kondisi</label>
                        <select id="addKondisi" class="form-input">
                            <option value="Bagus">Bagus</option>
                            <option value="Periksa">Periksa</option>
                            <option value="Rusak">Rusak</option>
                        </select>
                    </div>
                </div>
                
                <label class="form-label">Keterangan / Ref</label>
                <input type="text" id="addKet" class="form-input">
                
                <label class="form-label">Lokasi Gudang</label>
                <select id="addLokasi" class="form-input">
                    <option value="Gudang Kanguru">Gudang Kanguru</option>
                    <option value="Gudang Mrican">Gudang Mrican</option>
                </select>
                
                <button type="submit" id="btnSubmitAdd" style="width:100%; padding:14px; background:#16a34a; color:white; border:none; border-radius:8px; font-weight:900; margin-top:10px;">💾 SIMPAN ALAT</button>
                <button type="button" onclick="closeAddModal()" style="width:100%; padding:12px; background:#f1f5f9; color:#334155; border:none; border-radius:8px; font-weight:bold; margin-top:8px;">⬅ BATAL</button>
            </form>
        </div>
    </div>

    <!-- MODAL EDIT DATA & FOTO (SUDAH DIPERBAIKI) -->
    <div id="modalEditFull" class="modal-overlay">
        <div class="modal-content" style="max-width:400px; max-height:85vh; overflow-y:auto; background:white; padding:20px; border-radius:15px;">
            <h3 style="margin-top:0; color:#ea580c; margin-bottom:20px;">✏️ Edit Data & Foto Alat</h3>
            <form id="formEditFull" onsubmit="submitEditFull(event)">
                <input type="hidden" id="editRowIndex">
                
                <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px dashed #cbd5e1; margin-bottom:15px; text-align:center;">
                    <label class="form-label" style="color:#ea580c; margin-bottom:10px;">📸 Kelola Foto (Maksimal 3)</label>
                    <div id="previewEditFotos" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:10px;"></div>
                    <div id="btnContainerEditFoto" style="display:flex; gap:10px; justify-content:center;">
                        <button type="button" onclick="document.getElementById('editFotoKamera').click()" style="flex:1; padding:10px; border-radius:8px; background:#3b82f6; color:white; border:none; font-weight:bold; cursor:pointer; font-size:11px;">📷 Buka Kamera</button>
                        <button type="button" onclick="document.getElementById('editFotoGaleri').click()" style="flex:1; padding:10px; border-radius:8px; background:#8b5cf6; color:white; border:none; font-weight:bold; cursor:pointer; font-size:11px;">🖼️ Pilih Galeri</button>
                    </div>
                    <input type="file" id="editFotoKamera" accept="image/*" capture="environment" style="display:none;" onchange="handleNewEditFotos(this)">
                    <input type="file" id="editFotoGaleri" accept="image/*" multiple style="display:none;" onchange="handleNewEditFotos(this)">
                </div>
                
                <label class="form-label">Nama Alat Utama *</label>
                <input type="text" id="editNama" class="form-input" required>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label class="form-label">Kode Barang</label>
                        <input type="text" id="editKode" class="form-input">
                    </div>
                    <div style="flex:1;">
                        <label class="form-label">Kode Wadah</label>
                        <input type="text" id="editWadah" class="form-input">
                    </div>
                </div>
                
                <div style="display:flex; gap:10px;">
                    <div style="flex:1;">
                        <label class="form-label">Total Qty</label>
                        <input type="number" id="editJumlah" class="form-input" required>
                    </div>
                    <div style="flex:1;">
                        <label class="form-label">Kondisi</label>
                        <select id="editKondisi" class="form-input">
                            <option value="Bagus">Bagus</option>
                            <option value="Periksa">Periksa</option>
                            <option value="Rusak">Rusak</option>
                        </select>
                    </div>
                </div>
                
                <label class="form-label">Keterangan / Ref</label>
                <input type="text" id="editKet" class="form-input">
                
                <button type="submit" id="btnSubmitEditFull" style="width:100%; padding:14px; background:#ea580c; color:white; border:none; border-radius:8px; font-weight:900; margin-top:10px;">💾 UPDATE DATA & FOTO</button>
                <button type="button" onclick="closeEditFullModal()" style="width:100%; padding:12px; background:#f1f5f9; color:#334155; border:none; border-radius:8px; font-weight:bold; margin-top:8px;">⬅ BATAL</button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL EXPORT EXCEL CUSTOM (FILTER)         -->
    <!-- ========================================== -->
    <div id="modalExport" class="modal-overlay">
        <div class="modal-content" style="max-width:350px; background:white; padding:25px; border-radius:15px; position:relative;">
            <button onclick="closeExportModal()" style="position:absolute; top:15px; right:15px; border:none; background:#f1f5f9; width:30px; height:30px; border-radius:50%; font-weight:bold; cursor:pointer; color:#334155;">✕</button>
            <h3 style="margin-top:0; color:#10b981; margin-bottom:5px; font-weight:900; text-align:center;">📥 Export Data Excel</h3>
            <p style="font-size:11px; color:#64748b; margin-bottom:20px; text-align:center;">Filter data spesifik yang ingin diunduh:</p>
            
            <!-- Filter Lokasi (Akan diisi otomatis oleh JS) -->
            <label style="font-size:11px; font-weight:bold; color:#1e293b; margin-bottom:4px; display:block;">📍 Pilih Gudang / Lokasi:</label>
            <select id="exportLokasi" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:15px; font-size:12px; font-weight:bold; color:#334155;">
                <option value="ALL">📦 Semua Gudang / Lokasi</option>
            </select>

            <!-- Filter Tim -->
            <label style="font-size:11px; font-weight:bold; color:#1e293b; margin-bottom:4px; display:block;">👥 Pilih Tim Terkait:</label>
            <select id="exportTim" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:15px; font-size:12px; font-weight:bold; color:#334155;">
                <option value="ALL">Semua Tim</option>
                <option value="speaker">🔊 Tim Speaker</option>
                <option value="kabel">🔌 Tim Kabel</option>
                <option value="booth">🎛️ Tim Booth</option>
            </select>

            <!-- Filter Kondisi -->
            <label style="font-size:11px; font-weight:bold; color:#1e293b; margin-bottom:4px; display:block;">✨ Kondisi Barang:</label>
            <select id="exportKondisi" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:25px; font-size:12px; font-weight:bold; color:#334155;">
                <option value="ALL">Semua Kondisi</option>
                <option value="bagus">Bagus</option>
                <option value="periksa">Periksa</option>
                <option value="rusak">Rusak</option>
            </select>

            <button onclick="executeCustomExport()" style="width:100%; padding:14px; background:#10b981; color:white; border:none; border-radius:10px; font-weight:900; cursor:pointer; font-size:13px; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);">🚀 DOWNLOAD EXCEL</button>
        </div>
    </div>
    
    <div id="zoomModal" class="zoom-overlay" onclick="closeZoomModal()">
    <button onclick="closeZoomModal()" style="position:absolute; top:20px; left:20px; padding:10px 16px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4); border-radius:8px; color:white; font-weight:bold; cursor:pointer; backdrop-filter:blur(4px); z-index:1000000; box-shadow:0 4px 10px rgba(0,0,0,0.5);">⬅ Kembali</button>
    <img id="zoomImgSrc" src="" onclick="event.stopPropagation()">
</div>
    <div id="toastMsg" class="toast-msg">Notifikasi</div>
    
    <!-- MENGGUNAKAN VERSI 33.0 UNTUK MENCEGAH CACHE -->
    <script src="{{ site.baseurl }}/assets/js/script-gudang.js?v=41.0"></script>
    
    <!-- SCRIPT KEAMANAN RBAC -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const userRole = localStorage.getItem('av_session_role');
        const statusText = document.getElementById('modeStatusText');

        if (!userRole) return; 

        if (userRole === "Master" || userRole === "Kru") {
          document.querySelectorAll('.aksi-gudang').forEach(btn => {
            btn.style.display = "inline-flex"; 
            btn.style.setProperty("display", "inline-flex", "important");
          });
          
          if(statusText) {
             statusText.innerHTML = "🔴 Edit Mode Aktif";
             statusText.style.color = "#ef4444";
          }
        }
      });
    </script>
</body>
</html>
