---
layout: default
title: "Inventaris Audio"
location: "Semarang"
---

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body class="inventory-page">

    {% include navbar.html %}

    <main class="content-container" style="margin-top: 100px; padding: 20px;">
        <section class="inventory-header">
            <div class="header-text">
                <span class="badge-category" style="background: var(--soft-orange); color: var(--primary-orange); padding: 5px 15px; border-radius: 50px; font-weight: 800; font-size: 12px;">LOGISTIK AUDIO</span>
                <h1 style="color: var(--text-dark); margin-top: 10px;">Data Inventaris</h1>
                <p style="color: var(--text-gray);">Status ketersediaan alat A/V Semarang secara real-time.</p>
            </div>
            
            <div class="header-action" style="margin-top: 20px;">
                <input type="text" id="invSearch" placeholder="Cari nama alat..." onkeyup="searchInventory()" 
                       style="width: 100%; max-width: 400px; padding: 12px 20px; border-radius: 50px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-dark);">
            </div>
        </section>

        <div id="loading-state" style="text-align: center; padding: 50px;">
            <div class="spinner" style="width: 40px; height: 40px; border: 4px solid var(--soft-blue); border-top: 4px solid var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            <p style="margin-top: 15px; color: var(--text-gray);">Menghubungkan ke database...</p>
        </div>

        <div id="inventory-grid" class="inventory-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px;">
            </div>
    </main>

    <script>
        // GANTI INI dengan URL Web App Google Apps Script kamu
       const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_o-g7N48O6w9rJuoHyo2Z177xyBHSpQKJpzcCyJhdnzOtOIdWzVUyHeBwL4f3VDA5/exec?action=api";

        async function fetchInventory() {
            const grid = document.getElementById('inventory-grid');
            const loading = document.getElementById('loading-state');

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                loading.style.display = 'none';
                grid.innerHTML = '';

                data.forEach(item => {
    // Sesuaikan: di Apps Script kamu pakai 'kondisi', bukan 'Status'
    const statusClass = item.kondisi === "Tersedia" ? "background: #DCFCE7; color: #166534;" : "background: #FEE2E2; color: #991B1B;";
    
    const card = document.createElement('div');
    card.className = 'inv-card-item';
    card.style = "background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; transition: 0.3s;";
    
    card.innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span style="font-size: 12px; font-weight: 700; color: var(--text-gray);">${item.barang_milik || 'AV-ITM'}</span>
            <span style="font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 50px; ${statusClass}">${item.kondisi}</span>
        </div>
        <!-- Menampilkan foto jika ada -->
        ${item.foto_1 ? `<img src="${item.foto_1}" style="width:100%; border-radius:10px; margin-bottom:10px;">` : ''}
        <h3 style="color: var(--text-dark); margin: 10px 0;">${item.nama_barang}</h3>
        <div style="font-size: 14px; color: var(--text-gray);">
            <p>📍 ${item.tim}</p>
            <p>📦 Jumlah: ${item.jumlah}</p>
            <p style="font-size: 12px; margin-top:5px;">📝 ${item.keterangan}</p>
        </div>
    `;
    grid.appendChild(card);
});
            } catch (error) {
                loading.innerHTML = `<p style="color: var(--primary-orange);">Gagal memuat data. Cek koneksi atau URL Script.</p>`;
            }
        }

        function searchInventory() {
            let filter = document.getElementById('invSearch').value.toLowerCase();
            let cards = document.querySelectorAll('.inv-card-item');
            cards.forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(filter) ? "" : "none";
            });
        }

        document.addEventListener('DOMContentLoaded', fetchInventory);
    </script>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .inv-card-item:hover { border-color: var(--primary-orange) !important; transform: translateY(-5px); }
    </style>
</body>
</html>
