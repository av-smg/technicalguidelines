---
location: "MASTER"
---
<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/custom-gudang.css">
    
    <style>
        .admin-only { display: none !important; }
        body.admin-mode-active .admin-only { display: inline-flex !important; }
        body.admin-mode-active .admin-only-block { display: flex !important; }
        .btn-lock { background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; padding: 6px 12px; border-radius: 8px; font-weight: 800; cursor: pointer;}
        body.admin-mode-active .btn-lock { background: #f0fdf4; border-color: #22c55e; color: #16a34a; }
        .form-input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 12px; }
        .form-label { font-size: 11px; font-weight: bold; color: gray; display: block; margin-bottom: 4px; }
        .detail-gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; }
        .detail-gallery::-webkit-scrollbar { height: 6px; }
        .detail-gallery::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .gallery-img { height: 160px; min-width: 160px; object-fit: cover; border-radius: 10px; scroll-snap-align: center; border: 1px solid #e2e8f0; cursor: zoom-in; }
        .gallery-box { position: relative; scroll-snap-align: center; }
        .badge-wadah { position: absolute; bottom: 8px; left: 8px; background: rgba(234, 88, 12, 0.9); color: white; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 900; }
        .edit-foto-box { border: 1px dashed #ccc; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 8px; background: #f8fafc; position: relative; }
        .edit-foto-preview { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; display: none; }
        .btn-remove-foto { position: absolute; top: 5px; right: 5px; background: #ef4444; color: white; border: none; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; display: none; font-weight: bold;}
        .zoom-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 999999; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .zoom-overlay.active { opacity: 1; pointer-events: auto; }
        .zoom-overlay img { max-width: 95vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
        .btn-back-zoom { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; backdrop-filter: blur(5px); cursor: pointer; }
        .list-view-container { display: flex; flex-direction: column; gap: 10px; max-width: 1200px; margin: 0 auto; padding-bottom: 80px; }
        .list-item { display: flex; align-items: center; gap: 12px; background: white; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; cursor: pointer; position: relative; }
        .list-item.selected { border-color: #3b82f6; background: #eff6ff; border-width: 2px; }
        .list-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid #f1f5f9; flex-shrink: 0; }
        .list-info { flex: 1; overflow: hidden; }
        .list-title { font-weight: 800; font-size: 13px; margin: 0 0 4px 0; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast-msg { z-index: 9999999 !important; }
    </style>
</head>
<body id="inventoryBody">
    {% include navbar.html %}
    <main style="padding: 0 15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0;">
            <div>
                <h2 style="font-weight:900; margin:0;">LOGISTIK UTAMA</h2>
                <p style="font-size:11px; color:gray; margin:0;">Status: <span id="modeStatusText">🟢 Read-Only Mode</span></p>
            </div>
            <button id="btnUnlock" onclick="toggleAdminMode()" class="btn-lock">🔒 Buka Akses</button>
        </div>

        <div class="toolbar-card" style="margin-bottom:15px;">
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <input type="text" id="searchInput" class="search-input-modern" placeholder="Cari alat, merk, atau kode..." oninput="applyFilters()" style="flex:1; padding:10px; border-radius:8px; border:1px solid #ccc;">
                <button onclick="openScannerModal()" style="padding:10px 15px; border-radius:8px; background:#1e293b; color:white; border:none; font-weight:bold; white-space:nowrap; display:flex; align-items:center; gap:5px;">📷 Scan QR</button>
            </div>
            
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                <button onclick="openAddModal()" class="admin-only" style="padding:10px 15px; border-radius:8px; background:#16a34a; color:white; border:none; font-weight:bold; align-items:center; gap:5px;">➕ Tambah Baru</button>
                <button id="btnBulkMode" onclick="toggleBulkMode()" class="admin-only" style="padding:10px 15px; border-radius:8px; background:#ea580c; color:white; border:none; font-weight:bold; align-items:center; gap:5px;">🛒 Mode Massal</button>
                <button onclick="printSuratJalan()" class="admin-only" style="padding:10px 15px; border-radius:8px; background:#3b82f6; color:white; border:none; font-weight:bold; align-items:center; gap:5px;">📄 Surat Jalan</button>
                <button id="btnViewToggle" onclick="toggleViewMode()" style="padding:10px 15px; border-radius:8px; background:#f1f5f9; color:#334155; border:1px solid #ccc; font-weight:bold; display:flex; align-items:center; gap:5px; margin-left:auto;">📄 List View</button>
            </div>
            
            <div class="filter-pills-wrapper" style="margin-top:12px;">
                <button class="pill-btn active" onclick="setFilterPill('all', this)">Semua Alat</button>
                <button class="pill-btn" onclick="setFilterPill('Akan Dibawa', this)">🛒 Akan Dibawa</button>
                <button class="pill-btn" onclick="setFilterPill('Sedang Dipakai', this)">🔌 Dipakai</button>
                <button class="pill-btn" onclick="setFilterPill('Di Gudang', this)">🏢 Di Gudang</button>
                <button class="pill-btn" onclick="setFilterPill('Rusak', this)" style="border-color:#ef4444; color:#ef4444; background:#fef2f2;">🚨 Perbaikan</button>
            </div>
        </div>
        <div id="loading" style="text-align: center; padding: 40px; color: gray; font-weight:bold;">Memuat Data Database...</div>
        <div id="dataContainer" class="grid-cards"></div>
        <!-- ==========================================
     TAMBAHAN HTML: PANEL FILTER LANJUTAN
     ========================================== -->
<div style="padding: 0 15px; margin-bottom: 15px;">
    <button id="btnBukaFilter" style="background:#334155; color:white; border:none; padding:8px 15px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">
        ⚙️ FILTER LANJUTAN
    </button>
</div>

<!-- Laci Checkbox (Tersembunyi secara default) -->
<div id="panelFilterLanjutan" style="display:none; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:15px; margin:0 15px 15px 15px;">
    
    <div style="margin-bottom:10px; font-size:12px;"><strong>🛠️ Pilih Tim:</strong></div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px; font-size:11px;">
        <label><input type="checkbox" class="cek-tim" value="Tim Speaker"> Speaker</label>
        <label><input type="checkbox" class="cek-tim" value="Tim Kabel"> Kabel</label>
        <label><input type="checkbox" class="cek-tim" value="Tim Booth"> Booth</label>
    </div>

    <div style="margin-bottom:10px; font-size:12px;"><strong>📍 Pilih Status:</strong></div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; font-size:11px;">
        <label><input type="checkbox" class="cek-status" value="Gudang"> Di Gudang</label>
        <label><input type="checkbox" class="cek-status" value="Akan Dibawa"> Akan Dibawa</label>
        <label><input type="checkbox" class="cek-status" value="Lokasi Event"> Lokasi Event</label>
    </div>
</div>
    </main>

    <!-- MODAL TAMBAH BARU & EDIT (Tetap Sama) -->
    <div id="modalAdd" class="modal-overlay"><div class="modal-content" style="max-width:400px; max-height:85vh; overflow-y:auto; background:white; padding:20px; border-radius:15px;"><h3 style="margin-top:0; color:#16a34a; margin-bottom:20px;">➕ Tambah Alat Baru</h3><form id="formAdd" onsubmit="submitNewItem(event)"><div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px dashed #cbd5e1; margin-bottom:15px; text-align:center;"><label class="form-label" style="color:#1e293b; margin-bottom:10px; font-size:12px;">📸 Tambahkan Foto (Maksimal 3)</label><div style="display:flex; gap:10px; justify-content:center; margin-bottom:10px;"><button type="button" onclick="document.getElementById('addFotoKamera').click()" style="flex:1; padding:10px; border-radius:8px; background:#3b82f6; color:white; border:none; font-weight:bold; cursor:pointer; font-size:11px;">📷 Buka Kamera</button><button type="button" onclick="document.getElementById('addFotoGaleri').click()" style="flex:1; padding:10px; border-radius:8px; background:#8b5cf6; color:white; border:none; font-weight:bold; cursor:pointer; font-size:11px;">🖼️ Pilih Galeri</button></div><input type="file" id="addFotoKamera" accept="image/*" capture="environment" style="display:none;" onchange="handleNewFotos(this)"><input type="file" id="addFotoGaleri" accept="image/*" multiple style="display:none;" onchange="handleNewFotos(this)"><div id="previewAddFotos" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;"></div></div><label class="form-label">Nama Alat Utama *</label><input type="text" id="addNama" class="form-input" required><div style="display:flex; gap:10px;"><div style="flex:1;"><label class="form-label">Kode Barang</label><input type="text" id="addKode" class="form-input"></div><div style="flex:1;"><label class="form-label">Kode Wadah</label><input type="text" id="addWadah" class="form-input"></div></div><div style="display:flex; gap:10px;"><div style="flex:1;"><label class="form-label">Total (Qty)</label><input type="number" id="addJumlah" class="form-input" value="1" required></div><div style="flex:1;"><label class="form-label">Kondisi</label><select id="addKondisi" class="form-input"><option value="Bagus">Bagus</option><option value="Periksa">Periksa</option><option value="Rusak">Rusak</option></select></div></div><label class="form-label">Keterangan / Ref</label><input type="text" id="addKet" class="form-input"><button type="submit" id="btnSubmitAdd" style="width:100%; padding:14px; background:#16a34a; color:white; border:none; border-radius:8px; font-weight:900; margin-top:10px;">💾 SIMPAN ALAT</button><button type="button" onclick="closeAddModal()" style="width:100%; padding:12px; background:#f1f5f9; color:#334155; border:none; border-radius:8px; font-weight:bold; margin-top:8px;">⬅ BATAL</button></form></div></div>
    <div id="modalEditFull" class="modal-overlay"><div class="modal-content" style="max-width:400px; max-height:85vh; overflow-y:auto; background:white; padding:20px; border-radius:15px;"><h3 style="margin-top:0; color:#ea580c; margin-bottom:20px;">✏️ Edit Data & Foto Alat</h3><form id="formEditFull" onsubmit="submitEditFull(event)"><input type="hidden" id="editRowIndex"><div style="background:#f8fafc; padding:10px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:15px;"><label class="form-label" style="color:#ea580c;">📸 Kelola Foto (Ganti/Hapus)</label><div class="edit-foto-box" id="boxFoto0"><img id="previewFoto0" class="edit-foto-preview"><button type="button" class="btn-remove-foto" id="btnRemove0" onclick="removeFotoEdit(0)">✕</button><input type="file" id="editFoto0" class="form-input" accept="image/*" style="margin:0; display:none;" onchange="previewNewFoto(0)"><button type="button" id="btnUpload0" onclick="document.getElementById('editFoto0').click()" style="padding:8px; background:#e2e8f0; border:none; border-radius:6px; font-size:11px; font-weight:bold; width:100%;">+ Upload Foto 1</button><input type="hidden" id="existingId0"></div><div class="edit-foto-box" id="boxFoto1"><img id="previewFoto1" class="edit-foto-preview"><button type="button" class="btn-remove-foto" id="btnRemove1" onclick="removeFotoEdit(1)">✕</button><input type="file" id="editFoto1" class="form-input" accept="image/*" style="margin:0; display:none;" onchange="previewNewFoto(1)"><button type="button" id="btnUpload1" onclick="document.getElementById('editFoto1').click()" style="padding:8px; background:#e2e8f0; border:none; border-radius:6px; font-size:11px; font-weight:bold; width:100%;">+ Upload Foto 2</button><input type="hidden" id="existingId1"></div><div class="edit-foto-box" id="boxFoto2"><img id="previewFoto2" class="edit-foto-preview"><button type="button" class="btn-remove-foto" id="btnRemove2" onclick="removeFotoEdit(2)">✕</button><input type="file" id="editFoto2" class="form-input" accept="image/*" style="margin:0; display:none;" onchange="previewNewFoto(2)"><button type="button" id="btnUpload2" onclick="document.getElementById('editFoto2').click()" style="padding:8px; background:#e2e8f0; border:none; border-radius:6px; font-size:11px; font-weight:bold; width:100%;">+ Upload Foto 3</button><input type="hidden" id="existingId2"></div></div><label class="form-label">Nama Alat Utama *</label><input type="text" id="editNama" class="form-input" required><div style="display:flex; gap:10px;"><div style="flex:1;"><label class="form-label">Kode Barang</label><input type="text" id="editKode" class="form-input"></div><div style="flex:1;"><label class="form-label">Kode Wadah</label><input type="text" id="editWadah" class="form-input"></div></div><div style="display:flex; gap:10px;"><div style="flex:1;"><label class="form-label">Total Qty</label><input type="number" id="editJumlah" class="form-input" required></div><div style="flex:1;"><label class="form-label">Kondisi</label><select id="editKondisi" class="form-input"><option value="Bagus">Bagus</option><option value="Periksa">Periksa</option><option value="Rusak">Rusak</option></select></div></div><label class="form-label">Keterangan / Ref</label><input type="text" id="editKet" class="form-input"><button type="submit" id="btnSubmitEditFull" style="width:100%; padding:14px; background:#ea580c; color:white; border:none; border-radius:8px; font-weight:900; margin-top:10px;">💾 UPDATE DATA & FOTO</button><button type="button" onclick="closeEditFullModal()" style="width:100%; padding:12px; background:#f1f5f9; color:#334155; border:none; border-radius:8px; font-weight:bold; margin-top:8px;">⬅ BATAL</button></form></div></div>
    
    <div id="zoomModal" class="zoom-overlay" onclick="closeZoomModal()"><button class="btn-back-zoom" onclick="closeZoomModal()">⬅ Kembali</button><img id="zoomImgSrc" src="" onclick="event.stopPropagation()"></div>
    <div id="toastMsg" class="toast-msg">Notifikasi</div>
    <!-- UPDATE CACHE V.21.0 -->
    <script src="{{ site.baseurl }}/assets/js/script-gudang.js?v=24.0"></script>
</body>
</html>
