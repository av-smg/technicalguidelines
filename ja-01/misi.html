---
location: "JA-01"
---

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../style.css" />
  {% include head.html %}
  <style>
    /* Tambahan styling khusus untuk checklist agar rapi */
    .back-btn { display: inline-block; margin-bottom: 20px; font-weight: bold; color: #e67e22; text-decoration: none; }
    .task-item { display: flex; align-items: flex-start; gap: 15px; text-align: left; cursor: default; }
    .task-item input[type="checkbox"] { width: 22px; height: 22px; margin-top: 4px; accent-color: #e67e22; cursor: pointer; }
    .task-content { flex: 1; }
    .task-content h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
    .task-content p { margin: 0 0 10px 0; font-size: 0.9rem; line-height: 1.4; color: #555; }
    .task-meta { display: inline-block; padding: 4px 10px; background: #f1f5f9; color: #475569; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    .loading-text { text-align: center; padding: 40px; color: #666; font-weight: bold; }
  </style>
</head>
<body>
  {% include navbar.html %}

  <main>
    <div class="content-container">
      <a href="index.html" class="back-btn">&larr; Kembali ke Daftar Tim</a>
      
      <section class="team-section">
        <div class="team-header">
          <span class="team-badge" style="background: #e67e22; color: #fff;">CHECKLIST</span>
          <h2 id="team-title">Memuat data...</h2>
        </div>
        
        <div id="loading" class="loading-text">Sedang menyinkronkan data dengan server... ⏳</div>
        
        <div id="task-container" class="grid-cards" style="display: flex; flex-direction: column;">
          </div>
      </section>
    </div>
  </main>

  <footer class="simple-footer">
    <p>&copy; 2026 Tim Teknis A/V. All rights reserved.</p>
  </footer>

  <script>
    // --- MASUKKAN URL APPS SCRIPT KAMU DI SINI ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx48weXwYDomgoRo02hh-yXXHd-EdiexmYY3Rxg6SUC_ptGJKHYIPSv6kD96NFvLt7oOg/exec"; 

    const urlParams = new URLSearchParams(window.location.search);
    const currentTeamId = urlParams.get('id');

    if(currentTeamId) {
      document.getElementById('team-title').innerText = "Tugas: " + currentTeamId.replace(/-/g, ' ').toUpperCase();
    } else {
      document.getElementById('team-title').innerText = "Kode Tim Tidak Valid";
      document.getElementById('loading').style.display = 'none';
    }

    async function fetchTasks() {
      if (!currentTeamId) return;
      try {
        // Menggunakan redirect: "follow" penting untuk Google Apps Script
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "GET",
          redirect: "follow" 
        });
        
        const allTasks = await response.json();
        const teamTasks = allTasks.filter(task => task.kode === currentTeamId);
        renderTasks(teamTasks);
      } catch (error) {
        console.error("Fetch Error:", error);
        document.getElementById('loading').innerText = "⚠️ Gagal terhubung ke database. Cek koneksimu.";
      }
    }

    function renderTasks(tasks) {
      const container = document.getElementById('task-container');
      document.getElementById('loading').style.display = 'none';
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = '<div class="mission-card"><p style="text-align:center; margin:0;">Tidak ada tugas untuk tim ini.</p></div>';
        return;
      }

      tasks.sort((a, b) => parseInt(a.urutan) - parseInt(b.urutan));

      tasks.forEach(task => {
        const isChecked = task.selesai ? 'checked' : '';
        const card = document.createElement('div');
        // Pakai class mission-card dari style.css milikmu
        card.className = 'mission-card task-item'; 
        
        card.innerHTML = `
          <input type="checkbox" id="task-${task.row}" ${isChecked} onchange="updateTaskStatus(${task.row}, this.checked)">
          <div class="task-content">
            <h3>${task.urutan}. ${task.judul}</h3>
            <p>${task.deskripsi.replace(/\n/g, '<br>')}</p>
            <span class="task-meta">⏱️ Target: ${task.target_menit} Menit | Zona: ${task.zona}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function updateTaskStatus(rowNumber, isCompleted) {
      const checkbox = document.getElementById(`task-${rowNumber}`);
      checkbox.disabled = true;

      const payload = { row: rowNumber, selesai: isCompleted };

      try {
        // Mengubah mode request menjadi text/plain untuk menghindari CORS Preflight (OPTIONS request) yang sering ditolak Google
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {
            "Content-Type": "text/plain;charset=utf-8", 
          },
          body: JSON.stringify(payload),
          redirect: "follow"
        });
        checkbox.disabled = false;
      } catch (error) {
        console.error("Update Error:", error);
        alert("Gagal mengupdate status ke server.");
        checkbox.checked = !isCompleted; 
        checkbox.disabled = false;
      }
    }

    fetchTasks();
  </script>
</body>
</html>
