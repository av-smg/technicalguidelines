---
layout: default
title: "Inventaris Audio"
location: "Semarang"
---

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    </head>
<body class="inventory-page">

    {% include navbar.html %}

    <main class="content-container">
        <section class="inventory-header">
            <div class="header-text">
                <span class="badge-category">Logistik Audio</span>
                <h1>Data Inventaris</h1>
                <p>Status ketersediaan alat A/V secara real-time.</p>
            </div>
            <div class="header-action">
                <div class="search-box-inv">
                    <input type="text" id="invSearch" placeholder="Cari alat..." onkeyup="searchInventory()">
                </div>
            </div>
        </section>

        <div id="loading-state" class="loading-container">
            <div class="spinner"></div>
            <p>Menghubungkan ke database...</p>
        </div>

        <div id="inventory-grid" class="inventory-grid" style="display: none;">
            </div>
    </main>

    <script>
        // URL Web App dari Google Apps Script kamu
        const SCRIPT_URL = "URL_GOOGLE_APPS_SCRIPT_KAMU_DI_SINI";

        async function fetchInventory() {
            const grid = document.getElementById('inventory-grid');
            const loading = document.getElementById('loading-state');

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();

                loading.style.display = 'none';
                grid.style.display = 'grid';
                grid.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'inv-card-item';
                    
                    // Logika warna status
                    const statusClass = item.Status === "Tersedia" ? "status-ready" : "status-used";
                    
                    card.innerHTML = `
                        <div class="inv-card-top">
                            <span class="inv-id">${item.ID || 'No ID'}</span>
                            <span class="inv-status ${statusClass}">${item.Status}</span>
                        </div>
                        <h3>${item.NamaBarang}</h3>
                        <div class="inv-details">
                            <p><span>Lokasi:</span> ${item.Lokasi}</p>
                            <p><span>Jumlah:</span> ${item.Jumlah} ${item.Satuan}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Gagal memuat data:", error);
                loading.innerHTML = `<p style="color: red;">Koneksi Gagal. Pastikan Deployment Apps Script sudah 'Anyone'.</p>`;
            }
        }

        function searchInventory() {
            let filter = document.getElementById('invSearch').value.toLowerCase();
            let cards = document.querySelectorAll('.inv-card-item');
            
            cards.forEach(card => {
                let text = card.innerText.toLowerCase();
                card.style.display = text.includes(filter) ? "" : "none";
            });
        }

        // Jalankan saat halaman dimuat
        document.addEventListener('DOMContentLoaded', fetchInventory);
    </script>

    <style>
        /* Style khusus halaman inventaris (Bisa dipindah ke style.css) */
        .inventory-header {
            margin: 40px 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
        }

        .badge-category {
            background: var(--soft-orange);
            color: var(--primary-orange);
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .inv-card-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .inv-card-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-orange);
        }

        .inv-card-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .inv-status {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 50px;
        }

        .status-ready { background: #DCFCE7; color: #166534; }
        .status-used { background: #FEE2E2; color: #991B1B; }

        .inv-details p {
            font-size: 14px;
            margin: 5px 0;
            color: var(--text-gray);
        }

        .inv-details span { font-weight: 700; color: var(--text-dark); }

        .loading-container {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--soft-blue);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
