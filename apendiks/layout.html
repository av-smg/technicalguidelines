---
location: "APENDIKS"
---
<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <style>
        .document-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        body.dark-mode .document-card {
            background: #1e293b;
            border-color: #334155;
        }
        .card-title {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
        }
        body.dark-mode .card-title {
            color: #f8fafc;
        }
        .layout-img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            cursor: zoom-in;
            transition: transform 0.2s;
            /* Tambahan: pastikan tinggi gambar menyesuaikan dan background abu agar loading tidak kosong */
            height: auto;
            background-color: #f1f5f9;
        }
        body.dark-mode .layout-img { border-color: #475569; background-color: #0f172a; }
        .layout-img:hover { opacity: 0.9; }
    </style>
</head>
<body id="apendiksBody">
    {% include navbar.html %}
    <main style="padding: 15px 10px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <div>
                <h2 style="font-weight:900; margin:0; font-size:18px;">LAYOUT & JALUR KABEL</h2>
                <p style="font-size:11px; color:gray; margin:0;">Denah penempatan alat & skema tarikan kabel</p>
            </div>
            <a href="{{ site.baseurl }}/" style="padding:6px 12px; background:#f1f5f9; color:#334155; border-radius:6px; text-decoration:none; font-weight:bold; font-size:11px; border:1px solid #ccc;">⬅ Kembali</a>
        </div>

        <!-- 1. KOTAK LAYOUT ALAT -->
        <div class="document-card">
            <h3 class="card-title">📍 Denah Penempatan Alat</h3>
            <!-- File: layout-terbaru.jpg -->
            <img src="{{ site.baseurl }}/assets/img/layout-terbaru.jpg" class="layout-img" alt="Layout Area" onclick="window.open(this.src, '_blank')" title="Klik untuk memperbesar">
            
            <div style="margin-top:15px; text-align:center;">
                <a href="{{ site.baseurl }}/assets/img/layout-terbaru.jpg" download="Layout_Penempatan_Alat.jpg" style="display:inline-block; padding:10px 20px; background:#2563eb; color:white; font-weight:bold; text-decoration:none; border-radius:8px; font-size:12px; box-shadow:0 2px 4px rgba(37,99,235,0.3);">
                    📥 Download Layout Area
                </a>
            </div>
        </div>

        <!-- 2. KOTAK LAYOUT KABEL -->
        <div class="document-card">
            <h3 class="card-title">🔌 Denah Jalur Kabel Utama</h3>
            <!-- File: layout-jalurkabel.jpg (Ditambah parameter cache-busting ?v=1) -->
            <img src="{{ site.baseurl }}/assets/img/layout-jalurkabel.jpg?v=1" class="layout-img" alt="Layout Kabel" onclick="window.open(this.src, '_blank')" title="Klik untuk memperbesar" onerror="this.onerror=null; this.src=''; this.alt='⚠️ Gagal memuat gambar. Pastikan file layout-jalurkabel.jpg sudah ter-upload di folder assets/img/'; this.style.padding='20px'; this.style.textAlign='center';">
            
            <div style="margin-top:15px; text-align:center;">
                <a href="{{ site.baseurl }}/assets/img/layout-jalurkabel.jpg?v=1" download="Layout_Jalur_Kabel.jpg" style="display:inline-block; padding:10px 20px; background:#ea580c; color:white; font-weight:bold; text-decoration:none; border-radius:8px; font-size:12px; box-shadow:0 2px 4px rgba(234,88,12,0.3);">
                    📥 Download Jalur Kabel
                </a>
            </div>
        </div>

    </main>
</body>
</html>
