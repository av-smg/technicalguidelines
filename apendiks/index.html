<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apendiks | Daftar Lampiran</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main-wrapper">
        <header class="page-header">
            <h1>Daftar Apendiks</h1>
            <p>Referensi teknis, dokumen pendukung, dan aset media.</p>
            <input type="text" id="appendixSearch" placeholder="Cari dokumen..." onkeyup="searchFunction()">
        </header>

        <section class="appendix-content">
            <div class="category">
                <h2>Dokumen Teknis</h2>
                <ul class="list-items">
                    <li><a href="docs/skema-audio.pdf">Skema Jalur Audio TOA</a></li>
                    <li><a href="docs/inventory-logic.md">Logika Sistem Inventaris</a></li>
                </ul>
            </div>

            <div class="category">
                <h2>Media & Videografi</h2>
                <ul class="list-items">
                    <li><a href="assets/shotlist-template.xlsx">Template Shotlist Video</a></li>
                    <li><a href="assets/ghibli-color-palette.pdf">Palet Warna Ghibli Style</a></li>
                </ul>
            </div>
        </section>
    </div>

    <script>
        function searchFunction() {
            let input = document.getElementById('appendixSearch').value.toLowerCase();
            let categories = document.querySelectorAll('.category');
            
            categories.forEach(cat => {
                let items = cat.querySelectorAll('li');
                let hasVisibleItem = false;

                items.forEach(item => {
                    let text = item.textContent.toLowerCase();
                    if (text.includes(input)) {
                        item.style.display = "";
                        hasVisibleItem = true;
                    } else {
                        item.style.display = "none";
                    }
                });
                // Sembunyikan judul kategori jika tidak ada isi yang cocok
                cat.style.display = hasVisibleItem ? "" : "none";
            });
        }
    </script>
</body>
</html>
