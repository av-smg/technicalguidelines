<header>
    <div class="nav-container">
        <div class="nav-group-left">
            <button class="hamburger" id="menu-open-btn">
                <span></span><span></span><span></span>
            </button>
            <a href="{{ '/' | relative_url }}" class="logo-link">
                <img src="{{ '/assets/image_94faf8.png' | relative_url }}" alt="Logo" class="main-logo">
                <span class="site-tagline">Technical Guidelines</span>
            </a>
            
            <nav class="nav-menu" id="side-menu-drawer">
                <button class="menu-close" id="menu-close-btn">&times;</button>
                <div class="menu-content-top">
                    <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
                    <a href="{{ '/ja-01/' | relative_url }}" class="nav-link">JA-01</a>
                    <a href="{{ '/jw-08/' | relative_url }}" class="nav-link">JW-08</a>
                    <a href="{{ '/apendiks/' | relative_url }}" class="nav-link">Apendiks</a>
                </div>
                <div class="menu-content-bottom-mobile">
                    <button class="theme-toggle-mobile" onclick="toggleTheme()">
                        <span class="theme-icon-status">🌙</span> <span>Mode Layar</span>
                    </button>
                </div>
            </nav>
        </div>

        <div class="nav-group-right">
            <div class="search-wrapper" id="search-wrapper-desktop">
                <div class="search-content">
                    <div class="search-header">
                        <input type="text" id="missionSearch" placeholder="Cari panduan..." autocomplete="off" onkeyup="filterMissions()">
                        <button class="search-close" id="search-close-desktop">&times;</button>
                    </div>
                </div>
            </div>

            <button class="mobile-search-trigger" id="search-trigger-global">🔍</button>

            <button class="theme-toggle" onclick="toggleTheme()">
                <span class="theme-icon-status">🌙</span>
            </button>

            {% if page.location %}
            <div class="location-badge">{{ page.location }}</div>
            {% endif %}
        </div>
    </div>

    <div class="search-dropdown-mobile" id="search-mobile-dropdown">
        <div class="search-inner">
            <span>🔍</span>
            <input type="text" id="missionSearchMobile" placeholder="Cari..." onkeyup="filterMissionsMobile()">
            <button class="search-close-btn" id="search-close-mobile">&times;</button>
        </div>
        <div id="search-results-list"></div>
    </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 1. THEME MANAGEMENT
    const body = document.body;
    const themeIcons = document.querySelectorAll('.theme-icon-status');

    function updateIcons(isDark) {
        themeIcons.forEach(icon => {
            icon.innerText = isDark ? '☀️' : '🌙';
        });
    }

    if (localStorage.getItem('theme') === 'dark') {
        body.classList.add('dark-mode');
        updateIcons(true);
    }

    window.toggleTheme = function() {
        body.classList.toggle('dark-mode');
        const isDarkNow = body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDarkNow ? 'dark' : 'light');
        updateIcons(isDarkNow);
    };

    // 2. HAMBURGER MENU
    const menuDrawer = document.getElementById('side-menu-drawer');
    const openBtn = document.getElementById('menu-open-btn');
    const closeBtn = document.getElementById('menu-close-btn');

    if (openBtn) openBtn.addEventListener('click', () => menuDrawer.classList.add('active'));
    if (closeBtn) closeBtn.addEventListener('click', () => menuDrawer.classList.remove('active'));

    // 3. SEARCH LOGIC (DESKTOP VS MOBILE)
    const searchBtn = document.getElementById('search-trigger-global');
    const searchWrapper = document.getElementById('search-wrapper-desktop');
    const searchDropdown = document.getElementById('search-mobile-dropdown');
    const inputDesktop = document.getElementById('missionSearch');
    const inputMobile = document.getElementById('missionSearchMobile');

    if (searchBtn) {
        searchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.innerWidth > 600) {
                // Desktop: Expand Horizontal
                searchWrapper.classList.toggle('active');
                if (searchWrapper.classList.contains('active')) inputDesktop.focus();
            } else {
                // Mobile: Dropdown
                searchDropdown.classList.toggle('active');
                if (searchDropdown.classList.contains('active')) inputMobile.focus();
            }
        });
    }

    // Tombol Close
    document.getElementById('search-close-desktop')?.addEventListener('click', () => searchWrapper.classList.remove('active'));
    document.getElementById('search-close-mobile')?.addEventListener('click', () => searchDropdown.classList.remove('active'));

    // Click Outside to Close
    window.addEventListener('click', (e) => {
        if (searchWrapper && !searchWrapper.contains(e.target) && e.target !== searchBtn) {
            searchWrapper.classList.remove('active');
        }
        if (searchDropdown && !searchDropdown.contains(e.target) && e.target !== searchBtn) {
            searchDropdown.classList.remove('active');
        }
        if (menuDrawer && !menuDrawer.contains(e.target) && !openBtn.contains(e.target)) {
            menuDrawer.classList.remove('active');
        }
    });
});

// 4. FILTER FUNCTIONS
function filterMissions() {
    let input = document.getElementById('missionSearch').value.toLowerCase();
    let cards = document.querySelectorAll('.location-main-card-link, .card-link');
    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
    });
}

function filterMissionsMobile() {
    let input = document.getElementById('missionSearchMobile').value.toLowerCase();
    let cards = document.querySelectorAll('.location-main-card-link, .card-link');
    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
    });
}
</script>
