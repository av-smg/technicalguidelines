location: "APENDIKS"
title: Daftar Apendiks

<!DOCTYPE html>
<html lang="id">
<head>
    {% include head.html %}
    <style>
        /* ==========================================
           MODERN UI - REDIRECT PAGE
           ========================================== */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');

        body { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 0; transition: 0.3s; }
        
        .content-container { max-width: 650px; margin: 80px auto; padding: 20px 15px; text-align: center; }

        .empty-state-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 30px;
            border: 2px dashed #cbd5e1;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .icon { font-size: 65px; margin-bottom: 20px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        
        .empty-state-box h2 { font-size: 1.8rem; font-weight: 900; margin: 0 0 15px 0; color: #0f172a; letter-spacing: -0.5px; }
        .empty-state-box p { font-size: 1.05rem; color: #64748b; font-weight: 600; margin: 0 0 35px 0; line-height: 1.6; }

        .btn-home {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 16px 32px;
            background: #f97316;
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 1.1rem;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(249, 115, 22, 0.4);
            background: #ea580c;
        }

        .btn-home:active {
            transform: translateY(2px);
            box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);
        }

        /* 🌙 DARK MODE SAKTI */
        body.dark-mode, [data-theme="dark"] { background-color: #020617; color: #e2e8f0; }
        body.dark-mode .empty-state-box { background: #0f172a; border-color: #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        body.dark-mode .empty-state-box h2 { color: #f8fafc; }
        body.dark-mode .empty-state-box p { color: #94a3b8; }
        body.dark-mode .btn-home { box-shadow: 0 8px 20px rgba(234, 88, 12, 0.2); }
    </style>
</head>
<body id="apendiksListBody">
    {% include navbar.html %}

    <div class="content-container">
        <div class="empty-state-box">
            <div class="icon">🚀</div>
            <h2>Pusat Informasi Dialihkan</h2>
            <p>
                Seluruh informasi terkini mengenai <b>Daftar Apendiks, Struktur Personil, dan Dokumen Teknis</b> kini telah diintegrasikan agar lebih mudah diakses.
            </p>
            
            <a href="{{ site.baseurl }}/" class="btn-home">
                ⬅ Menuju Halaman Utama
            </a>
        </div>
    </div>
</body>
</html>
