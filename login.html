---
layout: default
title: Login Kru
---

<div style="max-width: 400px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;">
  <h2 style="margin-bottom: 10px; color: #0f172a;">🔒 Akses Kru A/V</h2>
  <p style="color: #64748b; margin-bottom: 25px;">Masukkan 5 karakter PIN Personal Anda.</p>
  
  <form onsubmit="prosesLogin(event)">
    <input 
      type="text" 
      id="inputPin" 
      maxlength="5" 
      placeholder="Contoh: K7N2X" 
      style="width: 100%; padding: 15px; font-size: 1.5rem; text-align: center; letter-spacing: 5px; text-transform: uppercase; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 15px; font-weight: bold;" 
      required
    >
    <button type="submit" id="btnSubmit" style="width: 100%; padding: 15px; background: #f97316; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s;">LOGIN MASUK 🚀</button>
  </form>
  
  <p id="errorMsg" style="color: #ef4444; display: none; font-weight: bold; margin-top: 15px; background: #fee2e2; padding: 10px; border-radius: 8px;"></p>
</div>

<!-- Panggil Script Auth -->
<script src="{{ site.baseurl }}/assets/js/auth.js"></script>
